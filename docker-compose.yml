version: "3.8"

services:
  db:
    image: postgres:16
    container_name: eduhub_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-eduhub}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-yourpassword}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - eduhub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - eduhub_network

  pgadmin:
    image: dpage/pgadmin4
    container_name: eduhub_pgadmin
    restart: unless-stopped
    user: root
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@eduhub.co.za}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "True"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - eduhub_pgadmin:/var/lib/pgadmin
      - ./pgadmin-config/servers.json:/pgadmin4/servers.json:ro
      - ./pgadmin-config/pgpass:/tmp/pgpass:ro
    entrypoint: >
      /bin/sh -c "
      cp /tmp/pgpass /pgpass &&
      chmod 600 /pgpass &&
      chown pgadmin:root /pgpass &&
      /entrypoint.sh
      "
    depends_on:
      db:
        condition: service_healthy
    networks:
      - eduhub_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eduhub_backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      DB_HOST: db
      IN_DOCKER: "true"
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-eduhub}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-yourpassword}
      JWT_SECRET: ${JWT_SECRET:-eduhub_jwt_secret_change_in_production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-eduhub_refresh_secret_change_in_production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health',(r)=>{process.exit(r.statusCode===200?0:1)})"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - eduhub_network

  nginx:
    build:
      context: .
      dockerfile: ./nginx/Dockerfile
    container_name: eduhub_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    depends_on:
      - db
      - backend
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - eduhub_network

volumes:
  eduhub_pgdata:
    driver: local
  eduhub_pgadmin:
    driver: local

networks:
  eduhub_network:
    driver: bridge
