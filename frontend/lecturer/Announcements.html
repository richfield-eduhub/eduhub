<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Announcements — EduHub</title>
  <link rel="stylesheet" href="../shared.css"/>
  <style>
    .announcement-card { background: white; border-radius: 12px; border: 1px solid var(--rf-border); margin-bottom: 16px; overflow: hidden; }
    .announcement-header { padding: 16px 20px; border-bottom: 1px solid var(--rf-border); display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 8px; }
    .announcement-body { padding: 16px 20px; font-size: 14px; color: var(--rf-navy); line-height: 1.7; white-space: pre-wrap; }
    .priority-badge { padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
    .priority-low { background: #e0f2fe; color: #075985; }
    .priority-normal { background: #dbeafe; color: #1e40af; }
    .priority-high { background: #fed7aa; color: #9a3412; }
    .priority-urgent { background: #fee2e2; color: #991b1b; }
  </style>
</head>
<body>
<div id="navbar-root"></div>
<div class="main-content">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;flex-wrap:wrap;gap:12px">
    <h1 class="section-title" style="margin-bottom:0">ANNOUNCEMENTS</h1>
    <button class="btn btn-primary" onclick="openComposeModal()">✏️ New Announcement</button>
  </div>
  <p class="section-subtitle">Post announcements to your module students</p>

  <div id="announcements-list">
    <div style="text-align:center;padding:40px">
      <div class="spinner"></div>
      <p style="color:var(--rf-gray);margin-top:12px">Loading announcements...</p>
    </div>
  </div>
</div>

<!-- Compose modal -->
<div id="compose-modal" class="modal-overlay hidden">
  <div class="modal" style="max-width:700px">
    <div class="modal-header">
      <h3 id="modal-title">New Announcement</h3>
      <button class="modal-close" onclick="closeComposeModal()">×</button>
    </div>
    <div class="modal-body">
      <div id="compose-alert"></div>
      <div class="form-group" style="margin-bottom:16px">
        <label class="form-label">Module *</label>
        <select id="ann-module" class="form-input" required>
          <option value="">Select a module...</option>
        </select>
        <small style="color:var(--rf-gray);font-size:12px">Only students enrolled in this module will see the announcement</small>
      </div>
      <div class="form-group" style="margin-bottom:16px">
        <label class="form-label">Title *</label>
        <input id="ann-title" class="form-input" placeholder="e.g. Assignment Due Date Extended" maxlength="255" required/>
      </div>
      <div class="form-group" style="margin-bottom:16px">
        <label class="form-label">Priority</label>
        <select id="ann-priority" class="form-input">
          <option value="low">🔵 Low - General information</option>
          <option value="normal" selected>ℹ️ Normal - Standard update</option>
          <option value="high">⚠️ High - Important notice</option>
          <option value="urgent">🔴 Urgent - Requires immediate attention</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Message *</label>
        <textarea id="ann-content" class="form-textarea" style="min-height:160px" placeholder="Write your announcement here..." required></textarea>
        <small style="color:var(--rf-gray);font-size:12px">You can include assignment details, deadline changes, or important reminders</small>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeComposeModal()">Cancel</button>
      <button class="btn btn-primary" id="post-btn" onclick="postAnnouncement()">📢 Post Announcement</button>
    </div>
  </div>
</div>

<script src="../shared.js"></script>
<script>
const user = requireAuth('lecturer');
renderNavbar('lecturer-announcements');

let announcements = [];
let modules = [];
let editingAnnouncementId = null;

// Load lecturer's modules and announcements
loadData();

async function loadData() {
  await Promise.all([loadModules(), loadAnnouncements()]);
}

async function loadModules() {
  try {
    const response = await fetch(`${APP_CONFIG.API_URL}/lecturers/me/modules`, {
      headers: {
        'Authorization': `Bearer ${localStorage.getItem('authToken')}`,
      },
    });

    if (response.ok) {
      const data = await response.json();
      modules = data.data || [];
      renderModuleOptions();
    }
  } catch (error) {
    console.error('Error loading modules:', error);
  }
}

async function loadAnnouncements() {
  try {
    const response = await fetch(`${APP_CONFIG.API_URL}/lecturers/me/announcements`, {
      headers: {
        'Authorization': `Bearer ${localStorage.getItem('authToken')}`,
      },
    });

    if (response.ok) {
      const data = await response.json();
      announcements = data.announcements || data.data || [];
      renderAnnouncements();
    } else {
      document.getElementById('announcements-list').innerHTML = `
        <div style="text-align:center;padding:40px;background:white;border-radius:12px;border:1px solid var(--rf-border)">
          <div style="font-size:48px;margin-bottom:16px">📢</div>
          <h3 style="color:var(--rf-navy);margin-bottom:8px">No Announcements Yet</h3>
          <p style="color:var(--rf-gray)">Click "New Announcement" to post your first message.</p>
        </div>`;
    }
  } catch (error) {
    console.error('Error loading announcements:', error);
    document.getElementById('announcements-list').innerHTML = `
      <div style="text-align:center;padding:40px;background:white;border-radius:12px;border:1px solid var(--rf-border)">
        <div style="font-size:48px;margin-bottom:16px">📢</div>
        <h3 style="color:var(--rf-navy);margin-bottom:8px">No Announcements Yet</h3>
        <p style="color:var(--rf-gray)">Click "New Announcement" to post your first message.</p>
      </div>`;
  }
}

function renderModuleOptions() {
  const select = document.getElementById('ann-module');
  const options = modules.map(m =>
    `<option value="${m.id}">${m.code} - ${m.name}</option>`
  ).join('');
  select.innerHTML = '<option value="">Select a module...</option>' + options;
}

function renderAnnouncements() {
  const container = document.getElementById('announcements-list');

  if (announcements.length === 0) {
    container.innerHTML = `
      <div style="text-align:center;padding:60px;background:white;border-radius:12px;border:1px solid var(--rf-border)">
        <div style="font-size:64px;margin-bottom:16px">📢</div>
        <h3 style="color:var(--rf-navy);margin-bottom:8px">No Announcements Yet</h3>
        <p style="color:var(--rf-gray);margin-bottom:24px">Click "New Announcement" to post a message to your students.</p>
        <button class="btn btn-primary" onclick="openComposeModal()">✏️ Create First Announcement</button>
      </div>`;
    return;
  }

  const priorityEmoji = {
    low: '🔵',
    normal: 'ℹ️',
    high: '⚠️',
    urgent: '🔴'
  };

  container.innerHTML = announcements.map(ann => {
    const module = modules.find(m => m.id === ann.module_id);
    const moduleName = module ? `${module.code} - ${module.name}` : 'Unknown Module';

    return `
      <div class="announcement-card">
        <div class="announcement-header">
          <div style="flex:1">
            <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px">
              <span style="font-size:24px">${priorityEmoji[ann.priority] || 'ℹ️'}</span>
              <div>
                <div style="font-weight:800;font-size:16px;color:var(--rf-navy)">${escapeHtml(ann.title)}</div>
                <div style="font-size:13px;color:var(--rf-gray);margin-top:2px">
                  ${moduleName} · Posted ${formatDate(ann.created_at)}
                </div>
              </div>
            </div>
            <span class="priority-badge priority-${ann.priority}">${ann.priority.toUpperCase()}</span>
          </div>
          <div style="display:flex;gap:8px">
            <button class="btn btn-secondary btn-sm" onclick="editAnnouncement('${ann.id}')" title="Edit">✏️</button>
            <button class="btn btn-secondary btn-sm" onclick="deleteAnnouncement('${ann.id}')" title="Delete">🗑️</button>
          </div>
        </div>
        <div class="announcement-body">${escapeHtml(ann.content)}</div>
      </div>
    `;
  }).join('');
}

function openComposeModal() {
  if (modules.length === 0) {
    showToast('You need to be assigned to at least one module to create announcements', 'warning');
    return;
  }

  editingAnnouncementId = null;
  document.getElementById('modal-title').textContent = 'New Announcement';
  document.getElementById('ann-module').value = '';
  document.getElementById('ann-title').value = '';
  document.getElementById('ann-priority').value = 'normal';
  document.getElementById('ann-content').value = '';
  document.getElementById('compose-modal').classList.remove('hidden');
}

function editAnnouncement(announcementId) {
  const ann = announcements.find(a => a.id === announcementId);
  if (!ann) return;

  editingAnnouncementId = announcementId;
  document.getElementById('modal-title').textContent = 'Edit Announcement';
  document.getElementById('ann-module').value = ann.module_id;
  document.getElementById('ann-title').value = ann.title;
  document.getElementById('ann-priority').value = ann.priority;
  document.getElementById('ann-content').value = ann.content;
  document.getElementById('compose-modal').classList.remove('hidden');
}

async function postAnnouncement() {
  clearAlert('compose-alert');

  const moduleId = document.getElementById('ann-module').value;
  const title = document.getElementById('ann-title').value.trim();
  const priority = document.getElementById('ann-priority').value;
  const content = document.getElementById('ann-content').value.trim();

  if (!moduleId) {
    showAlert('compose-alert', 'Please select a module', 'error');
    return;
  }

  if (!title) {
    showAlert('compose-alert', 'Please enter a title', 'error');
    return;
  }

  if (!content) {
    showAlert('compose-alert', 'Please enter a message', 'error');
    return;
  }

  const announcementData = {
    moduleId: moduleId,
    title: title,
    content: content,
    priority: priority,
  };

  try {
    const url = editingAnnouncementId
      ? `${APP_CONFIG.API_URL}/announcements/${editingAnnouncementId}`
      : `${APP_CONFIG.API_URL}/announcements`;

    const method = editingAnnouncementId ? 'PUT' : 'POST';

    setLoading('post-btn', true, editingAnnouncementId ? 'Updating...' : 'Posting...');

    const response = await fetch(url, {
      method: method,
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${localStorage.getItem('authToken')}`,
      },
      body: JSON.stringify(announcementData),
    });

    const data = await response.json();

    if (response.ok) {
      showToast(editingAnnouncementId ? 'Announcement updated successfully' : 'Announcement posted successfully', 'success');
      closeComposeModal();
      await loadAnnouncements();
    } else {
      showAlert('compose-alert', data.message || 'Failed to post announcement', 'error');
    }
  } catch (error) {
    console.error('Error posting announcement:', error);
    showAlert('compose-alert', 'An error occurred while posting the announcement', 'error');
  } finally {
    setLoading('post-btn', false, '📢 Post Announcement');
  }
}

async function deleteAnnouncement(announcementId) {
  if (!confirm('Are you sure you want to delete this announcement? This action cannot be undone.')) {
    return;
  }

  try {
    const response = await fetch(`${APP_CONFIG.API_URL}/announcements/${announcementId}`, {
      method: 'DELETE',
      headers: {
        'Authorization': `Bearer ${localStorage.getItem('authToken')}`,
      },
    });

    const data = await response.json();

    if (response.ok) {
      showToast('Announcement deleted successfully', 'success');
      await loadAnnouncements();
    } else {
      showToast(data.message || 'Failed to delete announcement', 'error');
    }
  } catch (error) {
    console.error('Error deleting announcement:', error);
    showToast('An error occurred while deleting the announcement', 'error');
  }
}

function closeComposeModal() {
  document.getElementById('compose-modal').classList.add('hidden');
  editingAnnouncementId = null;
}

function escapeHtml(text) {
  if (!text) return '';
  const map = {
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#039;'
  };
  return text.replace(/[&<>"']/g, m => map[m]);
}

function formatDate(dateString) {
  const date = new Date(dateString);
  const now = new Date();
  const diffMs = now - date;
  const diffMins = Math.floor(diffMs / 60000);
  const diffHours = Math.floor(diffMs / 3600000);
  const diffDays = Math.floor(diffMs / 86400000);

  if (diffMins < 1) return 'just now';
  if (diffMins < 60) return `${diffMins} minute${diffMins !== 1 ? 's' : ''} ago`;
  if (diffHours < 24) return `${diffHours} hour${diffHours !== 1 ? 's' : ''} ago`;
  if (diffDays < 7) return `${diffDays} day${diffDays !== 1 ? 's' : ''} ago`;

  return date.toLocaleDateString('en-ZA', { year: 'numeric', month: 'short', day: 'numeric' });
}
</script>
</body>
</html>
