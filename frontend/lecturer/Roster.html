<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Class Roster — EduHub</title>
  <link rel="stylesheet" href="../shared.css"/>
  <style>.filter-btn{padding:7px 14px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;border:1.5px solid var(--rf-border);background:white;color:var(--rf-navy)}.filter-btn.active{background:var(--rf-blue);color:white;border-color:var(--rf-blue)}</style>
</head>
<body>
<div id="navbar-root"></div>
<div class="main-content">
  <h1 class="section-title">CLASS ROSTER</h1>
  <p class="section-subtitle">All enrolled students across all programmes</p>

  <div style="display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap;align-items:center">
    <input id="search" placeholder="🔍 Search by name, student ID or programme..." oninput="render()"
      style="flex:1;min-width:240px;padding:10px 14px;border:1.5px solid var(--rf-border);border-radius:8px;font-size:14px"/>
  </div>

  <div style="display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap">
    <div>
      <label style="display:block;font-size:12px;font-weight:700;color:var(--rf-gray);margin-bottom:6px;text-transform:uppercase">Programme</label>
      <div id="qual-filter" style="display:flex;gap:8px;flex-wrap:wrap"></div>
    </div>
    <div>
      <label style="display:block;font-size:12px;font-weight:700;color:var(--rf-gray);margin-bottom:6px;text-transform:uppercase">Module</label>
      <div id="module-filter" style="display:flex;gap:8px;flex-wrap:wrap"></div>
    </div>
  </div>

  <div class="grid-3 mb-24" id="stats"></div>
  <div class="card" id="table-wrap"></div>
</div>

<script src="../shared.js"></script>
<script>
requireAuth('lecturer');
renderNavbar('lecturer-roster');

let regs = [];
let users = [];
let qualFilter = 'all';
let moduleFilter = 'all';

(async () => {
  // Load dashboard data from API first
  await ensureDashboardData();
  regs = getRegistrations().filter(r => r.status==='allocated'||r.status==='approved');
  users = getUsers();

  // Stats
  const uniqueStudents = [...new Set(regs.map(r=>r.studentId))];
  const quals = [...new Set(regs.map(r=>r.qualificationCode))];

  // Get all unique modules
  const moduleSet = new Set();
  regs.forEach(r => {
    if (r.modules && Array.isArray(r.modules)) {
      r.modules.forEach(m => moduleSet.add(JSON.stringify({code: m.code, name: m.name})));
    }
  });
  const modules = Array.from(moduleSet).map(m => JSON.parse(m)).sort((a,b) => a.code.localeCompare(b.code));

  document.getElementById('stats').innerHTML = [
    {icon:'🎓',label:'Total Students',value:uniqueStudents.length,bg:'#E0E7FF'},
    {icon:'📚',label:'Active Registrations',value:regs.length,bg:'#D1FAE5'},
    {icon:'🏫',label:'Programmes',value:quals.length,bg:'#FEF3C7'},
  ].map(s=>`<div class="stat-card"><div class="stat-icon" style="background:${s.bg}"><span>${s.icon}</span></div><div><div class="stat-value">${s.value}</div><div class="stat-label">${s.label}</div></div></div>`).join('');

  // Qual filter buttons
  document.getElementById('qual-filter').innerHTML = ['all',...quals].map(q=>`
    <button class="filter-btn ${q==='all'&&qualFilter==='all'?'active':q===qualFilter?'active':''}" onclick="setQual('${q}')">${q==='all'?'All':q}</button>`).join('');

  // Module filter buttons
  document.getElementById('module-filter').innerHTML = ['all',...modules].map((m,idx)=>{
    const code = m === 'all' ? 'all' : m.code;
    const label = m === 'all' ? 'All' : m.code;
    return `<button class="filter-btn ${code==='all'?'active':''}" onclick="setModule('${code}')">${label}</button>`;
  }).join('');

  render();
})();

function setQual(q){
  qualFilter=q;
  document.querySelectorAll('#qual-filter .filter-btn').forEach(b=>b.classList.remove('active'));
  event.target.classList.add('active');
  render();
}

function setModule(m){
  moduleFilter=m;
  document.querySelectorAll('#module-filter .filter-btn').forEach(b=>b.classList.remove('active'));
  event.target.classList.add('active');
  render();
}

function render() {
  const q = document.getElementById('search').value.toLowerCase();
  let rows = regs;

  // Filter by qualification
  if (qualFilter !== 'all') {
    rows = rows.filter(r => r.qualificationCode === qualFilter);
  }

  // Filter by module
  if (moduleFilter !== 'all') {
    rows = rows.filter(r => {
      return r.modules && r.modules.some(m => m.code === moduleFilter);
    });
  }

  // Search filter
  if (q) {
    rows = rows.filter(r => {
      const studentName = r.name || (r.firstName && r.lastName ? `${r.firstName} ${r.lastName}` : '');
      const moduleCodes = r.modules ? r.modules.map(m => m.code).join(' ') : '';
      return studentName.toLowerCase().includes(q) ||
             r.studentId.toLowerCase().includes(q) ||
             r.qualificationName.toLowerCase().includes(q) ||
             moduleCodes.toLowerCase().includes(q);
    });
  }

  // Update stats based on filtered rows
  const uniqueStudents = [...new Set(rows.map(r => r.studentId))];
  const quals = [...new Set(rows.map(r => r.qualificationCode))];

  document.getElementById('stats').innerHTML = [
    {icon:'🎓',label:'Total Students',value:uniqueStudents.length,bg:'#E0E7FF'},
    {icon:'📚',label:'Active Registrations',value:rows.length,bg:'#D1FAE5'},
    {icon:'🏫',label:'Programmes',value:quals.length,bg:'#FEF3C7'},
  ].map(s=>`<div class="stat-card"><div class="stat-icon" style="background:${s.bg}"><span>${s.icon}</span></div><div><div class="stat-value">${s.value}</div><div class="stat-label">${s.label}</div></div></div>`).join('');

  if (!rows.length) {
    document.getElementById('table-wrap').innerHTML = '<div style="padding:48px;text-align:center;color:var(--rf-gray)"><div style="font-size:40px;margin-bottom:12px">🔍</div><div>No students match your search.</div></div>';
    return;
  }

  document.getElementById('table-wrap').innerHTML = `
    <table class="data-table">
      <thead><tr><th>Student</th><th>Student ID</th><th>Programme</th><th>Year/Sem</th><th>Modules Enrolled</th></tr></thead>
      <tbody>${rows.map(r=>{
        // Get student name from registration data (has first_name, last_name)
        const studentName = r.name || (r.firstName && r.lastName ? `${r.firstName} ${r.lastName}` : 'Unknown');
        const modulesList = r.modules && r.modules.length > 0
          ? r.modules.map(m => `<span style="display:inline-block;font-family:var(--font-mono);font-size:11px;background:#f0f4f8;padding:2px 6px;border-radius:4px;margin:2px">${m.code}</span>`).join('')
          : '<span style="color:var(--rf-gray);font-size:12px">None</span>';
        return `<tr>
          <td><div style="font-weight:600">${studentName}</div><div style="font-size:12px;color:var(--rf-gray)">—</div></td>
          <td style="font-family:var(--font-mono);font-size:12px;color:var(--rf-blue)">${r.studentId}</td>
          <td><div style="font-weight:600;font-size:13px">${r.qualificationCode}</div><div style="font-size:12px;color:var(--rf-gray)">${r.qualificationName}</div></td>
          <td><div style="font-size:13px">Year ${r.studyYear || r.year}</div><div style="font-size:12px;color:var(--rf-gray)">Sem ${r.semester}</div></td>
          <td><div style="display:flex;flex-wrap:wrap;gap:3px">${modulesList}</div><div style="font-size:11px;color:var(--rf-gray);margin-top:4px">${r.modules?.length || 0} module${r.modules?.length !== 1 ? 's' : ''}</div></td>
        </tr>`;
      }).join('')}</tbody>
    </table>`;
}

render();
</script>
</body>
</html>
