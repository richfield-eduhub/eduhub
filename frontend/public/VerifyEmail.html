<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Verify Email — EduHub</title>
  <link rel="stylesheet" href="../shared.css" />
  <style>
    body { background: var(--rf-offwhite); }
    .verify-container { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .verify-card { background: white; border-radius: 12px; padding: 48px; max-width: 520px; width: 100%; box-shadow: 0 4px 24px rgba(0,20,77,0.08); text-align: center; }
    .icon-circle { width: 80px; height: 80px; border-radius: 50%; margin: 0 auto 24px; display: flex; align-items: center; justify-content: center; font-size: 40px; }
    .icon-circle.loading { background: rgba(0,122,204,0.1); color: var(--rf-blue); animation: pulse 1.5s infinite; }
    .icon-circle.success { background: rgba(40,167,69,0.1); color: #28a745; }
    .icon-circle.error { background: rgba(220,53,69,0.1); color: #dc3545; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
  </style>
</head>
<body>
  <div class="verify-container">
    <div class="verify-card">
      <div id="status-icon" class="icon-circle loading">⏳</div>
      <h2 id="status-title" style="font-family:var(--font-display);font-size:28px;letter-spacing:1px;margin-bottom:12px">Verifying Your Email...</h2>
      <p id="status-message" style="color:var(--rf-gray);font-size:16px;line-height:1.6;margin-bottom:32px">Please wait while we verify your email address.</p>

      <div id="action-buttons" style="display:none;flex-direction:column;gap:12px">
        <a href="Login.html" class="btn btn-primary btn-lg" style="width:100%;justify-content:center">Go to Login →</a>
        <button id="resend-btn" class="btn btn-secondary btn-lg" style="width:100%;justify-content:center" onclick="resendVerification()">Resend Verification Email</button>
      </div>

      <div style="margin-top:32px;padding-top:24px;border-top:1px solid var(--rf-border)">
        <p style="font-size:14px;color:var(--rf-gray)">Need help? <a href="mailto:support@eduhub.ac.za" style="color:var(--rf-blue);font-weight:600">Contact Support</a></p>
      </div>
    </div>
  </div>

  <script src="../shared.js"></script>
  <script>
    const statusIcon = document.getElementById('status-icon');
    const statusTitle = document.getElementById('status-title');
    const statusMessage = document.getElementById('status-message');
    const actionButtons = document.getElementById('action-buttons');

    // Get token from URL
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    if (!token) {
      showError('Invalid Verification Link', 'The verification link is invalid or expired. Please request a new verification email.');
    } else {
      verifyEmail(token);
    }

    async function verifyEmail(token) {
      try {
        const response = await fetch(`${APP_CONFIG.API_URL}/auth/verify-email`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token }),
        });

        const data = await response.json();

        if (response.ok) {
          showSuccess('Email Verified Successfully!', 'Your email address has been verified. You can now log in to your account.');
        } else {
          showError('Verification Failed', data.message || 'Unable to verify your email address. The link may be expired.');
        }
      } catch (error) {
        console.error('Verification error:', error);
        showError('Verification Failed', 'An error occurred while verifying your email. Please try again later.');
      }
    }

    function showSuccess(title, message) {
      statusIcon.className = 'icon-circle success';
      statusIcon.textContent = '✓';
      statusTitle.textContent = title;
      statusMessage.textContent = message;
      actionButtons.style.display = 'flex';
      document.getElementById('resend-btn').style.display = 'none';
    }

    function showError(title, message) {
      statusIcon.className = 'icon-circle error';
      statusIcon.textContent = '✗';
      statusTitle.textContent = title;
      statusMessage.textContent = message;
      actionButtons.style.display = 'flex';
    }

    async function resendVerification() {
      const user = getCurrentUser();
      if (!user || !user.accessToken) {
        alert('Please log in first to resend the verification email.');
        window.location.href = 'Login.html';
        return;
      }

      setLoading('resend-btn', true, 'Sending...');

      try {
        const response = await fetch(`${APP_CONFIG.API_URL}/auth/send-verification`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${user.accessToken}`,
          },
        });

        const data = await response.json();

        if (response.ok) {
          statusMessage.textContent = 'Verification email sent! Please check your inbox.';
          statusIcon.className = 'icon-circle success';
          statusIcon.textContent = '📧';
        } else {
          alert(data.message || 'Failed to send verification email.');
        }
      } catch (error) {
        console.error('Resend error:', error);
        alert('An error occurred. Please try again later.');
      } finally {
        setLoading('resend-btn', false, 'Resend Verification Email');
      }
    }
  </script>
</body>
</html>
