<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Apply — EduHub</title>
    <link rel="stylesheet" href="../shared.css" />
    <style>
      body {
        background: #f4f4f4;
      }
      .step-panel {
        display: none;
      }
      .step-panel.active {
        display: block;
      }
      .type-card {
        flex: 1;
        min-width: 160px;
        border: 2px solid #e5e7eb;
        border-radius: 10px;
        padding: 16px 14px;
        cursor: pointer;
        background: white;
        transition: all 0.15s;
        text-align: center;
      }
      .type-card.selected {
        border-color: #123f7a;
        background: #eef2ff;
      }
      .qual-card {
        border: 2px solid #e5e7eb;
        border-radius: 8px;
        padding: 14px 16px;
        cursor: pointer;
        background: white;
        transition: all 0.15s;
        margin-bottom: 10px;
      }
      .qual-card.selected {
        border-color: #123f7a;
        background: #eef2ff;
      }
      .module-row {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 13px 16px;
        border-radius: 8px;
        cursor: pointer;
        border: 2px solid #e5e7eb;
        background: #fafafa;
        transition: all 0.12s;
        margin-bottom: 8px;
      }
      .module-row.picked {
        border-color: #123f7a;
        background: #eef2ff;
      }
      .chk {
        width: 22px;
        height: 22px;
        border-radius: 5px;
        border: 2px solid #d1d5db;
        background: white;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.12s;
        flex-shrink: 0;
      }
      .module-row.picked .chk {
        background: #123f7a;
        border-color: #123f7a;
        color: white;
        font-weight: 700;
      }
      .form-section-header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding-bottom: 12px;
        border-bottom: 2px solid #e5e7eb;
        margin-bottom: 16px;
      }
    </style>
  </head>
  <body>
    <div id="navbar-root"></div>
    <div
      id="app"
      style="
        max-width: 780px;
        margin: 0 auto;
        padding: 32px 24px;
        min-height: 100vh;
      "
    ></div>
    <script src="../shared.js"></script>
    <script>
      const NEW_STEPS = [
        "Identity Check",
        "Personal & Contact",
        "Application Intent",
        "Marks & APS",
        "Documents",
        "Review",
        "Pay & Submit",
      ];
      function buildDefaultSubjectEntries(count = 7) {
        const rows = Array.from({ length: count }, () => ({
          subject: "",
          mark: "",
        }));
        if (rows[3]) rows[3].subject = "Life Orientation";
        return rows;
      }
      function ensureMinimumSubjectRows(entries, min = 7) {
        const list = Array.isArray(entries)
          ? entries.map((row) => ({
              subject: String(row?.subject || "").trim(),
              mark: String(row?.mark || "").trim(),
            }))
          : [];
        while (list.length < min) {
          list.push({ subject: "", mark: "" });
        }
        if (list[3] && !list[3].subject) {
          list[3].subject = "Life Orientation";
        }
        return list;
      }
      const LANGUAGE_SUBJECT_OPTIONS = [
        "English Home Language",
        "Afrikaans Home Language",
        "Xitsonga Home Language",
        "isiZulu Home Language",
        "Sepedi Home Language",
        "Setswana Home Language",
        "Sesotho Home Language",
        "Tshivenda Home Language",
        "isiXhosa Home Language",
        "isiNdebele Home Language",
        "Siswati Home Language",
        "Xitsonga First Additional Language",
        "English First Additional Language",
        "Afrikaans First Additional Language",
        "isiZulu First Additional Language",
        "Sepedi First Additional Language",
        "Setswana First Additional Language",
        "Sesotho First Additional Language",
      ];
      const ELECTIVE_SUBJECT_OPTIONS = [
        "Accounting",
        "Agricultural Sciences",
        "Business Studies",
        "Computer Applications Technology",
        "Consumer Studies",
        "Dramatic Arts",
        "Economics",
        "Engineering Graphics and Design",
        "Geography",
        "History",
        "Information Technology",
        "Life Sciences",
        "Physical Sciences",
        "Religion Studies",
        "Tourism",
        "Visual Arts",
        "Music",
        "Technical Mathematics",
        "Technical Sciences",
      ];
      const RETURNING_STEPS = [
        "Verify Identity",
        "Confirm Details",
        "New Modules",
        "Review & Submit",
      ];
      // Re-enrolment from student dashboard: skip identity lookup, personal info & docs
      const REENROL_STEPS = ["New Modules", "Review & Submit"];

      // ── Detect re-enrolment mode passed from student Dashboard ──
      const _urlParams = new URLSearchParams(window.location.search);
      const REENROL_MODE = _urlParams.get("mode") === "reenrol";
      const REENROL_CURRENT_YEAR = parseInt(
        _urlParams.get("currentYear") || "1",
        10,
      );
      const REENROL_NEXT_YEAR = parseInt(_urlParams.get("nextYear") || "2", 10);
      const REENROL_QUAL_CODE = _urlParams.get("qualCode") || "";
      const REENROL_STUDENT_ID = _urlParams.get("studentId") || "";

      // Pre-fetch existing student record for re-enrolment
      let _reenrolStudent = null;
      if (REENROL_MODE && REENROL_STUDENT_ID) {
        // Try to find by studentId from approved applications
        const _allApps = getApplications ? getApplications() : [];
        const _found = _allApps.find(
          (a) => a.studentId === REENROL_STUDENT_ID && a.status === "approved",
        );
        if (_found) {
          _reenrolStudent = {
            application: _found,
            user: {
              name: (_found.firstName || "") + " " + (_found.lastName || ""),
              studentId: _found.studentId,
            },
          };
        }
      }

      function formatYearLabel(year) {
        const n = Number(year) || 1;
        if (n % 100 >= 11 && n % 100 <= 13) return `${n}th Year`;
        if (n % 10 === 1) return `${n}st Year`;
        if (n % 10 === 2) return `${n}nd Year`;
        if (n % 10 === 3) return `${n}rd Year`;
        return `${n}th Year`;
      }

      function getYearFromAdmissionLabel(label) {
        const match = String(label || "").match(/(\d+)/);
        return match ? Number(match[1]) : 1;
      }

      // Compute allowed application years for this student
      // A 1st-year student can ONLY apply for 2nd Year (nextYear = currentYear + 1)
      function getAllowedAdmissionYears() {
        if (!REENROL_MODE) return [1, 2, 3, 4].map(formatYearLabel);
        const nextY = REENROL_NEXT_YEAR;
        // Only allow the exact next year (no skipping, no going back)
        return [formatYearLabel(nextY)];
      }

      let state = {
        // In re-enrol mode: lock type to 'returning', pre-confirm type selection, auto-load student
        appType: REENROL_MODE ? "returning" : "new",
        admissionFor: REENROL_MODE ? formatYearLabel(REENROL_NEXT_YEAR) : "",
        admissionStartSemester: "1st Semester",
        studyYear: REENROL_NEXT_YEAR,
        typeConfirmed: true,
        step: REENROL_MODE ? 0 : 0,
        submitted: false,
        submittedApp: null,
        draftId: null,
        draftStarted: false,
        savingDraft: false,
        submittingDraft: false,
        lookupValue: "",
        lookupError: "",
        identityDocumentType: "id",
        identityNumber: "",
        identityError: "",
        identityStatus: null,
        identityChecked: false,
        checkingIdentity: false,
        foundStudent: REENROL_MODE && _reenrolStudent ? _reenrolStudent : null,
        reenrolMode: REENROL_MODE,
        form: {
          firstName: "",
          lastName: "",
          idNumber: "",
          passportNumber: "",
          dateOfBirth: "",
          gender: "",
          nationality: "South African",
          phone: "",
          email: "",
          altEmail: "",
          streetAddress: "",
          suburb: "",
          city: "",
          province: "",
          postalCode: "",
          highSchool: "",
          highSchoolYear: "",
          highestGrade: "",
          tertiaryInstitution: "",
          tertiaryQualification: "",
          tertiaryYear: "",
          campusId: "",
          additionalQualifications: [],
          payerType: "self",
          payerName: "",
          payerRelation: "",
          payerPhone: "",
          payerEmail: "",
          payerAddress: "",
          guardianIdNumber: "",
          sponsorCompanyName: "",
          sponsorRegistrationNumber: "",
          popiaAccepted: false,
          qualificationCode: REENROL_MODE ? REENROL_QUAL_CODE : "",
          qualificationName: "",
          subjectEntries: buildDefaultSubjectEntries(),
          docsUploaded: [],
          tcAccepted: false,
        },
        qualificationCampuses: [],
        loadingCampuses: false,
        apsResult: null,
        apsLoading: false,
        errors: {},
      };

      // If re-enrol mode and student found, pre-fill form from existing record
      if (REENROL_MODE && _reenrolStudent) {
        const a = _reenrolStudent.application;
        state.form = {
          ...state.form,
          firstName: a.firstName || "",
          lastName: a.lastName || "",
          idNumber: a.idNumber || "",
          passportNumber: a.passportNumber || "",
          dateOfBirth: a.dateOfBirth || "",
          gender: a.gender || "",
          nationality: a.nationality || "South African",
          phone: a.phone || "",
          email: a.email || "",
          altEmail: a.altEmail || "",
          streetAddress: a.streetAddress || "",
          suburb: a.suburb || "",
          city: a.city || "",
          province: a.province || "",
          postalCode: a.postalCode || "",
          highSchool: a.highSchool || "",
          highSchoolYear: a.highSchoolYear || "",
          highestGrade: a.highestGrade || "",
          payerName: a.payerName || "",
          payerRelation: a.payerRelation || "",
          payerPhone: a.payerPhone || "",
          payerEmail: a.payerEmail || "",
          payerAddress: a.payerAddress || "",
          guardianIdNumber: a.guardianIdNumber || "",
          sponsorCompanyName: a.sponsorCompanyName || "",
          sponsorRegistrationNumber: a.sponsorRegistrationNumber || "",
          campusId: a.campusId || "",
          additionalQualifications: Array.isArray(a.additionalQualifications)
            ? a.additionalQualifications
            : [],
          payerType: a.payerType || "self",
          popiaAccepted: !!a.popiaAccepted,
          qualificationCode: a.qualificationCode || REENROL_QUAL_CODE,
          qualificationName: a.qualificationName || "",
          docsUploaded: [],
          tcAccepted: false,
        };
        // In re-enrol mode, jump straight to modules step (step 0 of REENROL_STEPS = modules)
        state.step = 0;
      }

      // Update form field WITHOUT re-rendering (prevents focus/cursor loss on every keystroke)
      function set(k, v) {
        state.form[k] = v;
      }
      // Update field AND re-render (only for structural changes like nationality toggle)
      function setAndRender(k, v) {
        state.form[k] = v;
        render();
      }
      function setState(patch) {
        Object.assign(state, patch);
        render();
      }
      function isForeign() {
        return state.form.nationality !== "South African";
      }

      function deriveDobFromSaId(idNumber) {
        const digits = String(idNumber || "").replace(/\D/g, "");
        if (digits.length < 6) return "";
        const yy = Number(digits.slice(0, 2));
        const mm = Number(digits.slice(2, 4));
        const dd = Number(digits.slice(4, 6));
        if (!mm || mm < 1 || mm > 12 || !dd || dd < 1 || dd > 31) return "";
        const now = new Date();
        const currentYY = now.getFullYear() % 100;
        const fullYear = yy <= currentYY ? 2000 + yy : 1900 + yy;
        const date = new Date(fullYear, mm - 1, dd);
        if (
          date.getFullYear() !== fullYear ||
          date.getMonth() !== mm - 1 ||
          date.getDate() !== dd
        ) {
          return "";
        }
        return `${fullYear}-${String(mm).padStart(2, "0")}-${String(dd).padStart(2, "0")}`;
      }

      function validateSAIdDOB(idNumber, dateOfBirth) {
        const derivedDob = deriveDobFromSaId(idNumber);
        if (!derivedDob || !dateOfBirth) return false;
        const dob = String(dateOfBirth).slice(0, 10);
        return derivedDob === dob;
      }

      // SA ID checksum (Luhn) validation
      function isValidSouthAfricanIdNumber(idNumber) {
        const digits = String(idNumber || "").replace(/\D/g, "");
        if (!/^\d{13}$/.test(digits)) return false;
        let sum = 0;
        let shouldDouble = false;
        for (let i = digits.length - 1; i >= 0; i -= 1) {
          let n = Number(digits[i]);
          if (shouldDouble) {
            n *= 2;
            if (n > 9) n -= 9;
          }
          sum += n;
          shouldDouble = !shouldDouble;
        }
        return sum % 10 === 0;
      }

      function isValidCompanyRegistrationNumber(value) {
        const normalized = String(value || "")
          .trim()
          .toUpperCase();
        // South African CIPC style format: YYYY/NNNNNN/NN
        return /^\d{4}\/\d{6}\/\d{2}$/.test(normalized);
      }

      function handleSouthAfricanIdInput(inputEl) {
        const digits = String(inputEl.value || "")
          .replace(/\D/g, "")
          .slice(0, 13);
        inputEl.value = digits;
        set("idNumber", digits);
        if (isForeign()) return;
        const derivedDob = deriveDobFromSaId(digits);
        set("dateOfBirth", derivedDob || "");
        const dobInput = document.getElementById("date-of-birth-input");
        if (dobInput) dobInput.value = state.form.dateOfBirth || "";
      }

      function setNationality(value) {
        state.form.nationality = value;
        if (value === "South African") {
          const derivedDob = deriveDobFromSaId(state.form.idNumber);
          state.form.dateOfBirth = derivedDob || "";
        }
        render();
      }

      function normalizeIdentityInput(raw, docType) {
        if (docType === "passport") {
          return String(raw || "")
            .trim()
            .toUpperCase()
            .slice(0, 20);
        }
        return String(raw || "")
          .replace(/\D/g, "")
          .slice(0, 13);
      }

      function buildIdentityPayload() {
        const isPassport = state.identityDocumentType === "passport";
        return {
          nationality:
            state.form.nationality || (isPassport ? "Other" : "South African"),
          id_number: isPassport ? "" : state.identityNumber,
          passport_number: isPassport ? state.identityNumber : "",
        };
      }

      function hydrateFormFromDraft(draft) {
        if (!draft) return;
        const isPassportIdentity = !!draft.passport_number;
        const draftIdNumber = draft.id_number || "";
        const draftDob =
          draft.date_of_birth ||
          (!isPassportIdentity ? deriveDobFromSaId(draftIdNumber) : "");
        const draftSubjectEntries = ensureMinimumSubjectRows(
          (Array.isArray(draft.mark_entries) ? draft.mark_entries : []).map(
            (entry) => ({
              subject: String(entry?.name || ""),
              mark:
                entry?.percentage != null
                  ? String(entry.percentage)
                  : String(entry?.symbol || entry?.range || ""),
            }),
          ),
        );
        state.identityDocumentType = isPassportIdentity ? "passport" : "id";
        state.identityNumber = isPassportIdentity
          ? draft.passport_number || ""
          : draftIdNumber;
        state.form = {
          ...state.form,
          firstName: draft.first_name || "",
          lastName: draft.last_name || "",
          idNumber: draftIdNumber,
          passportNumber: draft.passport_number || "",
          dateOfBirth: draftDob,
          gender: draft.gender || "",
          nationality: draft.nationality || "South African",
          phone: draft.phone || "",
          email: draft.email || "",
          altEmail: draft.alt_email || "",
          streetAddress: draft.street_address || "",
          suburb: draft.suburb || "",
          city: draft.city || "",
          province: draft.province || "",
          postalCode: draft.postal_code || "",
          highSchool: draft.high_school || "",
          highSchoolYear: draft.high_school_year || "",
          highestGrade: draft.highest_grade || "",
          tertiaryInstitution: draft.tertiary_institution || "",
          tertiaryQualification: draft.tertiary_qualification || "",
          tertiaryYear: draft.tertiary_year || "",
          campusId: draft.campus_id || "",
          additionalQualifications: Array.isArray(
            draft.additional_qualifications,
          )
            ? draft.additional_qualifications
            : [],
          payerType: draft.payer_type || "self",
          payerName: draft.payer_name || "",
          payerRelation: draft.payer_relation || "",
          payerPhone: draft.payer_phone || "",
          payerEmail: draft.payer_email || "",
          payerAddress: draft.payer_address || "",
          guardianIdNumber: draft.guardian_id_number || "",
          sponsorCompanyName: draft.sponsor_company_name || "",
          sponsorRegistrationNumber: draft.sponsor_registration_number || "",
          popiaAccepted: !!draft.popia_accepted,
          qualificationCode: draft.qualification_code || "",
          qualificationName: draft.qualification_name || "",
          subjectEntries: draftSubjectEntries,
          docsUploaded: Array.isArray(draft.docs_uploaded)
            ? draft.docs_uploaded
            : [],
          tcAccepted: !!draft.tc_accepted,
        };
        state.admissionFor = draft.admission_for || state.admissionFor;
        state.studyYear = draft.study_year || state.studyYear;
        state.appType =
          draft.application_type === "returning"
            ? "returning"
            : draft.application_type === "other"
              ? "other"
              : "new";
        state.draftId = draft.id || draft.draft_id || state.draftId;
        state.apsResult = draft.aps_result || null;
      }

      function resolveStepFromDraft(draft) {
        const hasPersonalCore = Boolean(
          draft.first_name &&
          draft.last_name &&
          draft.date_of_birth &&
          draft.gender &&
          draft.phone &&
          draft.email &&
          draft.street_address &&
          draft.city &&
          draft.province,
        );
        if (!hasPersonalCore) return 1;
        if (!draft.admission_for || !draft.qualification_code) return 2;
        const markEntries = Array.isArray(draft.mark_entries)
          ? draft.mark_entries
          : [];
        if (!markEntries.length) return 3;
        return 4;
      }

      // Returns the active step array depending on mode
      function getSteps() {
        if (state.reenrolMode) return REENROL_STEPS;
        if (state.appType === "returning") return RETURNING_STEPS;
        return NEW_STEPS;
      }

      function getSelectedQualification() {
        return (
          QUALIFICATIONS.find((q) => q.code === state.form.qualificationCode) ||
          null
        );
      }

      async function refreshQualificationCampuses() {
        const selected = getSelectedQualification();
        if (!selected || !selected.id) {
          state.qualificationCampuses = [];
          state.form.campusId = "";
          return;
        }
        state.loadingCampuses = true;
        render();
        // Business rule: all qualifications are offered at all campuses (including online)
        const res = await getAllCampuses();
        state.loadingCampuses = false;
        if (!res.ok || !Array.isArray(res.data) || !res.data.length) {
          // Fallback to qualification-specific endpoint if generic campus list is unavailable.
          const fallbackRes = await getCampusesByQualification(selected.id);
          if (!fallbackRes.ok || !Array.isArray(fallbackRes.data)) {
            state.qualificationCampuses = [];
            render();
            return;
          }
          state.qualificationCampuses = fallbackRes.data;
          if (fallbackRes.data.length === 1) {
            state.form.campusId = fallbackRes.data[0].id;
          } else if (
            !fallbackRes.data.some(
              (campus) => campus.id === state.form.campusId,
            )
          ) {
            state.form.campusId = "";
          }
          render();
          return;
        }
        state.qualificationCampuses = res.data;
        if (res.data.length === 1) {
          state.form.campusId = res.data[0].id;
        } else if (
          !res.data.some((campus) => campus.id === state.form.campusId)
        ) {
          state.form.campusId = "";
        }
        render();
      }

      function addAdditionalQualification() {
        state.form.additionalQualifications = [
          ...(state.form.additionalQualifications || []),
          {
            qualificationDescription: "",
            institutionName: "",
            academicLevel: "",
            studyType: "",
            studyStatus: "",
            from: "",
            to: "",
          },
        ];
        render();
      }

      function removeAdditionalQualification(index) {
        state.form.additionalQualifications = (
          state.form.additionalQualifications || []
        ).filter((_, i) => i !== index);
        render();
      }

      function setAdditionalQualificationField(index, key, value) {
        const list = [...(state.form.additionalQualifications || [])];
        if (!list[index]) return;
        list[index][key] = value;
        state.form.additionalQualifications = list;
      }

      function setSubjectEntryField(index, key, value) {
        const rows = [...(state.form.subjectEntries || [])];
        if (!rows[index]) return;
        rows[index][key] = value;
        state.form.subjectEntries = rows;
      }

      function addSubjectEntryRow() {
        state.form.subjectEntries = [
          ...(state.form.subjectEntries || []),
          { subject: "", mark: "" },
        ];
        render();
      }

      function removeSubjectEntryRow(index) {
        const rows = [...(state.form.subjectEntries || [])];
        if (rows.length <= 7) return;
        rows.splice(index, 1);
        state.form.subjectEntries = rows;
        render();
      }

      function validate() {
        const e = {},
          f = state.form,
          s = state.step,
          t = state.appType;
        const STEPS = getSteps();
        // Re-enrolment from dashboard: only T&C needed on last step, no personal/doc validation
        if (!state.reenrolMode) {
          if (t === "new" || t === "other") {
            if (s === 0) {
              if (!state.identityChecked) {
                e.identity = "Verify your ID/passport before continuing";
              }
            }
            if (s === 1) {
              if (!f.firstName) e.firstName = "Required";
              if (!f.lastName) e.lastName = "Required";
              if (!f.nationality) e.nationality = "Required";
              if (!isForeign()) {
                if (!f.idNumber || f.idNumber.length < 13)
                  e.idNumber = "Enter a valid 13-digit SA ID";
                else if (
                  f.dateOfBirth &&
                  !validateSAIdDOB(f.idNumber, f.dateOfBirth)
                )
                  e.idNumber =
                    "First 6 digits of your ID must match your date of birth (YYMMDD). E.g. born 2002-09-08 → ID starts with 020908";
              }
              if (
                isForeign() &&
                (!f.passportNumber || f.passportNumber.length < 5)
              )
                e.passportNumber = "Valid passport required";
              if (!f.dateOfBirth) e.dateOfBirth = "Required";
              if (!f.gender) e.gender = "Required";
              if (!f.phone) e.phone = "Required";
              if (!f.email || !f.email.includes("@"))
                e.email = "Enter a valid email";
              if (!f.streetAddress) e.streetAddress = "Required";
              if (!f.city) e.city = "Required";
              if (!f.province) e.province = "Required";
            }
            if (s === 2) {
              if (!state.appType) e.appType = "Application type is required";
              if (!state.admissionFor)
                e.admissionFor = "Admission year is required";
              if (!state.admissionStartSemester)
                e.admissionStartSemester = "Starting semester is required";
              if (!f.qualificationCode)
                e.qualificationCode = "Course applied for is required";
              if (state.qualificationCampuses.length > 1 && !f.campusId)
                e.campusId = "Please select a campus for this qualification";
            }
            if (s === 3) {
              const coreSubjects = getApsSubjectsPayload().filter(
                (item) =>
                  String(item.name || "")
                    .trim()
                    .toLowerCase() !== "life orientation",
              );
              if (coreSubjects.length < 6) {
                e.subjectEntries =
                  "Enter at least 6 subjects with marks (excluding Life Orientation).";
              }
            }
            if (s === 2) {
              if (!f.payerType)
                e.payerType = "Please choose who is responsible for payment";
              if (!f.payerName)
                e.payerName = "Responsible person name is required";
              if (!f.payerRelation)
                e.payerRelation = "Relationship is required";
              if (!f.payerPhone) e.payerPhone = "Phone/cell number is required";
              if (f.payerType === "guardian") {
                if (!f.guardianIdNumber)
                  e.guardianIdNumber = "Guardian ID number is required";
                else if (!isValidSouthAfricanIdNumber(f.guardianIdNumber))
                  e.guardianIdNumber =
                    "Enter a valid South African ID number (13 digits).";
                if (!f.payerEmail || !f.payerEmail.includes("@"))
                  e.payerEmail = "Valid email is required";
                if (!f.payerAddress)
                  e.payerAddress = "Billing/residential address is required";
                if (!f.popiaAccepted)
                  e.popiaAccepted =
                    "POPIA consent is required for guardian/sponsor billing";
              } else if (f.payerType === "sponsor_company") {
                if (!f.sponsorCompanyName)
                  e.sponsorCompanyName = "Company name is required";
                if (!f.sponsorRegistrationNumber)
                  e.sponsorRegistrationNumber =
                    "Company registration number is required";
                else if (
                  !isValidCompanyRegistrationNumber(f.sponsorRegistrationNumber)
                )
                  e.sponsorRegistrationNumber =
                    "Use format YYYY/NNNNNN/NN (e.g. 2019/123456/07).";
                if (!f.payerEmail || !f.payerEmail.includes("@"))
                  e.payerEmail = "Valid company contact email is required";
                if (!f.payerAddress)
                  e.payerAddress = "Company billing address is required";
                if (!f.popiaAccepted)
                  e.popiaAccepted =
                    "POPIA consent is required for company sponsor billing";
              }
            }
          }
          if (t === "returning" && s === 1) {
            if (!f.phone) e.phone = "Required";
            if (!f.email || !f.email.includes("@")) e.email = "Required";
          }
        }
        if (s === STEPS.length - 1 && !f.tcAccepted)
          e.tcAccepted = "You must accept the Terms and Conditions";
        state.errors = e;
        render();
        return Object.keys(e).length === 0;
      }

      function admissionToYear(af) {
        return getYearFromAdmissionLabel(af);

      function buildDraftPayload() {
        // Only include fields that have actual values - don't send empty strings
        const payload = {};
        const selectedQualification = getSelectedQualification();
        const markEntries = getApsSubjectsPayload();

        // Helper to add field only if it has a value
        const addField = (key, value) => {
          if (value !== null && value !== undefined && value !== "") {
            payload[key] = value;
          }
        };

        // Personal info
        addField("first_name", state.form.firstName);
        addField("last_name", state.form.lastName);
        addField("email", state.form.email);
        addField("phone", state.form.phone);
        addField("id_number", state.form.idNumber);
        addField("passport_number", state.form.passportNumber);
        addField("date_of_birth", state.form.dateOfBirth);
        addField("gender", state.form.gender);

        // Always include nationality with default
        payload.nationality = state.form.nationality || "South African";

        // Contact details
        addField("alt_email", state.form.altEmail);
        addField("street_address", state.form.streetAddress);
        addField("suburb", state.form.suburb);
        addField("city", state.form.city);
        addField("province", state.form.province);
        addField("postal_code", state.form.postalCode);

        // Education
        addField("high_school", state.form.highSchool);
        if (state.form.highSchoolYear)
          payload.high_school_year = state.form.highSchoolYear;
        addField("highest_grade", state.form.highestGrade);
        addField("tertiary_institution", state.form.tertiaryInstitution);
        addField("tertiary_qualification", state.form.tertiaryQualification);
        if (state.form.tertiaryYear)
          payload.tertiary_year = state.form.tertiaryYear;

        // Only include arrays if they have items
        if (
          state.form.additionalQualifications &&
          state.form.additionalQualifications.length > 0
        ) {
          payload.additional_qualifications =
            state.form.additionalQualifications;
        }

        // Qualification and campus
        if (selectedQualification?.id)
          payload.qualification_id = selectedQualification.id;
        if (state.form.campusId) payload.campus_id = state.form.campusId;

        // Marks
        if (markEntries && markEntries.length > 0) {
          payload.mark_entries = markEntries;
        }
        if (state.apsResult) payload.aps_result = state.apsResult;

        // Payer info
        payload.payer_type = state.form.payerType || "self";
        addField("payer_name", state.form.payerName);
        addField("payer_relation", state.form.payerRelation);
        addField("payer_phone", state.form.payerPhone);
        addField("payer_email", state.form.payerEmail);
        addField("payer_address", state.form.payerAddress);
        addField("guardian_id_number", state.form.guardianIdNumber);
        addField("sponsor_company_name", state.form.sponsorCompanyName);
        addField(
          "sponsor_registration_number",
          state.form.sponsorRegistrationNumber,
        );

        // Consents
        if (state.form.popiaAccepted) {
          payload.popia_accepted = true;
          payload.popia_version = "2026.1";
        }
        if (state.form.tcAccepted) {
          payload.tc_accepted = true;
          payload.tc_version = "2026.1";
        }

        // Application metadata
        addField("qualification_code", state.form.qualificationCode);
        addField("qualification_name", state.form.qualificationName);
        addField("admission_for", state.admissionFor);
        payload.application_type =
          state.appType === "other" ? "other" : state.appType || "new";
        if (state.studyYear) payload.study_year = state.studyYear;

        // Documents
        if (state.form.docsUploaded && state.form.docsUploaded.length > 0) {
          payload.docs_uploaded = state.form.docsUploaded;
        }

        return payload;
      }

      function normalizeMarkToken(rawValue) {
        const value = String(rawValue || "")
          .trim()
          .toUpperCase();
        if (!value) return null;
        if (/^\d{1,3}$/.test(value)) {
          return { percentage: Number(value) };
        }
        if (/^[A-G]$/.test(value)) {
          return { symbol: value };
        }
        if (/^\d{1,3}\s*-\s*\d{1,3}$/.test(value)) {
          return { range: value.replace(/\s+/g, "") };
        }
        return null;
      }

      function getApsSubjectsPayload() {
        const rows = Array.isArray(state.form.subjectEntries)
          ? state.form.subjectEntries
          : [];
        return rows
          .map((row) => {
            const name = String(row?.subject || "").trim();
            const normalized = normalizeMarkToken(row?.mark);
            if (!name || !normalized) return null;
            const canonical =
              name.toLowerCase() === "l.o" ? "Life Orientation" : name;
            return { name: canonical, ...normalized };
          })
          .filter(Boolean);
      }

      async function runApsEvaluation() {
        const subjects = getApsSubjectsPayload();
        if (!subjects.length) {
          showToast("Enter at least one subject mark first.", "error");
          return;
        }
        state.apsLoading = true;
        render();
        const res = await evaluateApsEligibility({
          study_level: "Undergraduate",
          subjects,
          additional_qualifications: (
            state.form.additionalQualifications || []
          ).map((item) => ({
            academic_level: item.academicLevel || "",
            study_type: item.studyType || "",
            study_status: item.studyStatus || "",
            qualification_description: item.qualificationDescription || "",
            institution_name: item.institutionName || "",
            from: item.from || "",
            to: item.to || "",
          })),
        });
        state.apsLoading = false;
        if (!res.ok || !res.data) {
          showToast(res.message || "APS evaluation failed.", "error");
          render();
          return;
        }
        state.apsResult = res.data;
        render();
      }

      function buildMinimalDraftPayload() {
        // Only send identity fields needed to start a draft
        const payload = {
          nationality: state.form.nationality || "South African",
          application_type: state.appType || "new",
        };

        // Add identity fields based on nationality
        if (isForeign()) {
          if (state.form.passportNumber)
            payload.passport_number = state.form.passportNumber;
        } else {
          if (state.form.idNumber) payload.id_number = state.form.idNumber;
        }

        // Add optional personal info if available
        if (state.form.firstName) payload.first_name = state.form.firstName;
        if (state.form.lastName) payload.last_name = state.form.lastName;
        if (state.form.email) payload.email = state.form.email;
        if (state.form.phone) payload.phone = state.form.phone;
        if (state.form.dateOfBirth)
          payload.date_of_birth = state.form.dateOfBirth;
        if (state.form.gender) payload.gender = state.form.gender;

        return payload;
      }

      async function ensureDraftStarted() {
        if (state.reenrolMode || state.appType === "returning") return true;
        if (state.draftId) return true;
        const res = await startApplicationDraft(buildMinimalDraftPayload());
        if (!res.ok || !res.data || !res.data.draft || !res.data.draft.id) {
          showToast(
            res.message || "Could not start application draft.",
            "error",
          );
          return false;
        }
        state.draftId = res.data.draft.id;
        state.draftStarted = true;
        return true;
      }

      async function saveDraftProgress() {
        if (state.reenrolMode || state.appType === "returning") return true;
        const ready = await ensureDraftStarted();
        if (!ready || !state.draftId) return false;
        state.savingDraft = true;
        const res = await updateApplicationDraft(
          state.draftId,
          buildDraftPayload(),
        );
        state.savingDraft = false;
        if (!res.ok) {
          showToast(
            res.message || "Autosave failed. Please try again.",
            "error",
          );
          return false;
        }
        return true;
      }

      async function nextStep() {
        if (
          !state.reenrolMode &&
          (state.appType === "new" || state.appType === "other") &&
          state.step === 0
        ) {
          await handleIdentityStep();
          return;
        }
        if (!validate()) return;
        if (
          !state.reenrolMode &&
          state.appType !== "returning" &&
          state.step === 3 &&
          !state.apsResult
        ) {
          await runApsEvaluation();
        }
        const ok = await saveDraftProgress();
        if (!ok) return;
        setState({ step: state.step + 1 });
      }

      function prevStep() {
        if (state.step > 0) setState({ step: state.step - 1 });
      }

      async function handleSubmit() {
        if (!validate()) return;
        if (!state.reenrolMode && state.appType !== "returning") {
          const saved = await saveDraftProgress();
          if (!saved) return;
        }
        const yr = state.reenrolMode ? REENROL_NEXT_YEAR : state.studyYear;
        const appType = state.reenrolMode
          ? "returning"
          : state.appType === "returning"
            ? "returning"
            : state.appType === "other"
              ? "other"
              : "new";
        const admFor = state.reenrolMode
          ? formatYearLabel(REENROL_NEXT_YEAR)
          : state.admissionFor || formatYearLabel(state.studyYear);
        const submissionPayload = {
          ...state.form,
          applicationType: appType,
          admissionFor: admFor,
          studyYear: yr,
          admissionStartSemester: state.admissionStartSemester,
        };
        console.log(
          "[Apply] Submission payload (frontend -> backend):",
          submissionPayload,
        );

        if (
          !state.reenrolMode &&
          state.appType !== "returning" &&
          state.draftId
        ) {
          state.submittingDraft = true;
          const paymentIntent = await createApplicationPaymentIntent(
            state.draftId,
          );
          if (!paymentIntent.ok) {
            state.submittingDraft = false;
            showToast(
              paymentIntent.message || "Could not start payment.",
              "error",
            );
            return;
          }
          const paymentConfirm = await confirmApplicationPayment(
            state.draftId,
            { paid: true },
          );
          if (!paymentConfirm.ok) {
            state.submittingDraft = false;
            showToast(
              paymentConfirm.message || "Payment confirmation failed.",
              "error",
            );
            return;
          }
          const submitted = await submitApplicationDraft(state.draftId);
          state.submittingDraft = false;
          if (!submitted.ok || !submitted.data) {
            showToast(
              submitted.message || "Submit failed. Please try again.",
              "error",
            );
            return;
          }
          setState({
            submitted: true,
            submittedApp: {
              studentId:
                submitted.data.student_number ||
                submitted.data.reference_number ||
                state.form.idNumber,
              id: submitted.data.id || state.draftId,
            },
          });
          return;
        }

        const app = await submitApplication(submissionPayload);
        const fallbackId =
          state.form.idNumber || state.form.passportNumber || "PENDING";
        setState({
          submitted: true,
          submittedApp: {
            studentId:
              app?.studentId ||
              app?.data?.student_number ||
              app?.data?.reference_number ||
              fallbackId,
            id: app?.id || app?.data?.id,
          },
        });
      }

      async function handleIdentityStep() {
        state.identityError = "";
        state.identityStatus = null;
        state.identityChecked = false;
        const normalized = normalizeIdentityInput(
          state.identityNumber,
          state.identityDocumentType,
        );
        state.identityNumber = normalized;
        const nationality = String(state.form.nationality || "").trim();

        if (!nationality) {
          state.identityError = "Please choose the applicant country.";
          render();
          return;
        }
        if (
          state.identityDocumentType === "id" &&
          nationality !== "South African"
        ) {
          state.identityError =
            "South African ID can only be used with South African nationality.";
          render();
          return;
        }
        if (
          state.identityDocumentType === "passport" &&
          nationality === "South African"
        ) {
          state.identityError =
            "Passport applications cannot use South African as applicant country.";
          render();
          return;
        }

        if (
          state.identityDocumentType === "id" &&
          (!normalized || normalized.length !== 13)
        ) {
          state.identityError =
            "Enter a valid 13-digit South African ID number.";
          render();
          return;
        }
        if (
          state.identityDocumentType === "passport" &&
          (!normalized || normalized.length < 5)
        ) {
          state.identityError = "Enter a valid passport number.";
          render();
          return;
        }

        const isPassport = state.identityDocumentType === "passport";
        state.form.idNumber = isPassport ? "" : normalized;
        state.form.passportNumber = isPassport ? normalized : "";
        if (!isPassport) {
          state.form.nationality = "South African";
          state.form.dateOfBirth = deriveDobFromSaId(normalized) || "";
        }

        state.checkingIdentity = true;
        render();
        const statusRes = await checkApplicationIdentityStatus(
          buildIdentityPayload(),
        );
        state.checkingIdentity = false;
        if (!statusRes.ok || !statusRes.data) {
          state.identityError =
            statusRes.message || "Could not verify this identity right now.";
          render();
          return;
        }

        state.identityStatus = statusRes.data;
        const latest = statusRes.data.latest_status;
        if (latest && latest !== "draft") {
          const statusUi = getIdentityStatusInfo(latest);
          if (statusUi) {
            showToast(statusUi.label, "info");
          }
        }

        if (statusRes.data.has_open_draft && statusRes.data.draft_id) {
          const draftRes = await getApplicationDraft(statusRes.data.draft_id);
          if (draftRes.ok && draftRes.data) {
            hydrateFormFromDraft(draftRes.data);
            state.identityChecked = true;
            await refreshQualificationCampuses();
            state.step = resolveStepFromDraft(draftRes.data);
            render();
            return;
          }
        }

        const draftStartRes = await startApplicationDraft({
          ...buildIdentityPayload(),
          application_type: "new",
        });
        if (
          !draftStartRes.ok ||
          !draftStartRes.data ||
          !draftStartRes.data.draft
        ) {
          state.identityError =
            draftStartRes.message ||
            "Could not start your application. Please try again.";
          render();
          return;
        }
        hydrateFormFromDraft(draftStartRes.data.draft);
        state.identityChecked = true;
        state.step = 1;
        render();
      }

      function toggleDoc(doc) {
        const docs = state.form.docsUploaded;
        state.form.docsUploaded = docs.includes(doc)
          ? docs.filter((d) => d !== doc)

        render();

      function getDynamicDocumentRequirements() {
        const base = Array.isArray(getDocumentRequirements(isForeign()))
          ? [...getDocumentRequirements(isForeign())]
          : [];
        const isSouthAfricanApplicant = !isForeign();
        const isCompanySponsor = state.form.payerType === "sponsor_company";

        // Keep identity requirements aligned with selected identity mode.
        const filteredBase = base.filter((doc) => {
          const label = String(doc || "").toLowerCase();
          if (
            isSouthAfricanApplicant &&
            /copy of passport|passport \(all pages\)/i.test(label)
          )
            return false;
          return true;
        });

        const mandatoryDocs = [
          isSouthAfricanApplicant
            ? "Certified copy of SA ID document"
            : "Certified copy of Passport (all pages)",
          "Certified copy of Matric certificate / latest Grade 12 results",
        ];

        if (isCompanySponsor) {
          mandatoryDocs.push("Proof of payment / funding letter");
        }

        // Remove funding proof from base; add it only when sponsor applies.
        const withoutFunding = filteredBase.filter(
          (doc) => !/proof of payment|funding letter/i.test(String(doc || "")),
        );

        const requiredLookup = new Set(
          mandatoryDocs.map((doc) => String(doc).trim().toLowerCase()),
        );

        const merged = [...mandatoryDocs, ...withoutFunding];
        const deduped = [];
        const seen = new Set();
        merged.forEach((doc) => {
          const normalized = String(doc || "").trim();
          const key = normalized.toLowerCase();
          if (!normalized || seen.has(key)) return;
          seen.add(key);
          deduped.push({
            name: normalized,
            required: requiredLookup.has(key),
          });
        });

        return deduped;
      }

      function renderDocuments(docList) {
        const f = state.form;
        const normalizedDocs = (Array.isArray(docList) ? docList : []).map(
          (item) =>
            typeof item === "string"
              ? { name: item, required: false }
              : {
                  name: String(item?.name || ""),
                  required: Boolean(item?.required),
                },
        );
        const uploadedCount = f.docsUploaded.length;
        const totalCount = normalizedDocs.length;
        const pct =
          totalCount > 0 ? Math.round((uploadedCount / totalCount) * 100) : 0;
        let html = "";
        html +=
          '<div class="form-section-header"><span style="font-size:20px">&#128206;</span><h3 style="font-weight:700;font-size:16px;color:#001A4D">Required Documents</h3></div>';
        html +=
          '<div style="background:#FEF3C7;border:1px solid #FDE68A;border-radius:10px;padding:14px 18px;margin-bottom:16px">';
        html +=
          '<div style="font-weight:700;color:#92400e;font-size:14px;margin-bottom:4px">&#9200; Important: Document Submission Deadline</div>';
        html +=
          '<div style="font-size:13px;color:#92400e;line-height:1.6">You may mark documents as ready now or submit them later. However, <strong>all documents must be received within 3&#8211;5 business working days</strong> of your application being approved. <strong>Failure to submit within this period will result in your application being cancelled</strong> and you will need to start a new application.</div>';
        html += "</div>";
        html += `<div style="background:#EEF2FF;border:1px solid #C7D2FE;border-radius:8px;padding:13px 16px;font-size:13px;color:#3730a3;margin-bottom:12px"><strong>Required by default:</strong> ${
          isForeign()
            ? "Passport copy + Grade 12/Matric results"
            : "SA ID copy + Grade 12/Matric results"
        }. ${
          state.form.payerType === "sponsor_company"
            ? "Because company sponsor is selected, proof of payment/funding letter is also required."
            : "Proof of payment/funding letter is only required when a sponsor/company payer is selected."
        }</div>`;
        if (isForeign()) {
          html +=
            '<div style="background:#EEF2FF;border:1px solid #C7D2FE;border-radius:8px;padding:13px 16px;font-size:14px;color:#3730a3;margin-bottom:12px">&#127757; As a foreign national, additional documents including a study permit and SAQA evaluation are required.</div>';
        }
        html +=
          '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px">';
        html +=
          '<div style="font-size:13px;color:#6b7280">' +
          uploadedCount +
          " of " +
          totalCount +
          " documents ready</div>";
        if (uploadedCount === totalCount && totalCount > 0) {
          html +=
            '<button type="button" onclick="state.form.docsUploaded=[];render()" style="background:#f3f4f6;color:#374151;border:1px solid #e5e7eb;padding:6px 14px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer">Clear All</button>';
        }
        html += "</div>";
        html +=
          '<div style="width:100%;background:#e5e7eb;border-radius:99px;height:6px;margin-bottom:16px">';
        html +=
          '<div style="background:#123f7a;height:6px;border-radius:99px;width:' +
          pct +
          '%;transition:width .3s"></div>';
        html += "</div>";
        normalizedDocs.forEach(function (docItem, i) {
          const doc = docItem.name;
          const isUploaded = f.docsUploaded.includes(doc);
          const isRequired = docItem.required;
          const inputId = "doc-file-" + i;
          const safeDoc = doc.replace(/'/g, "&#39;");
          html +=
            '<div style="border:1.5px solid ' +
            (isUploaded ? "#123f7a" : "#e5e7eb") +
            ";border-radius:10px;padding:14px 16px;background:" +
            (isUploaded ? "#EEF2FF" : "white") +
            ';margin-bottom:10px;transition:all .15s">';
          html +=
            '<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">';
          html +=
            '<div style="width:28px;height:28px;border-radius:6px;background:' +
            (isUploaded ? "#123f7a" : "#e5e7eb") +
            ";display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px;color:" +
            (isUploaded ? "white" : "#9ca3af") +
            ';font-weight:700">' +
            (isUploaded ? "&#10003;" : i + 1) +
            "</div>";
          html += '<div style="flex:1;min-width:0">';
          html +=
            '<div style="font-size:14px;font-weight:600;color:' +
            (isUploaded ? "#001A4D" : "#374151") +
            '">' +
            doc +
            (isRequired
              ? ' <span style="font-size:11px;background:#fee2e2;color:#991b1b;padding:2px 6px;border-radius:999px;margin-left:6px;vertical-align:middle">Required</span>'

          html +=
            '<div style="font-size:12px;color:' +
            (isUploaded ? "#059669" : "#9ca3af") +

            "</div>";
          html += "</div>";
          html +=
            '<div style="display:flex;gap:8px;align-items:center;flex-shrink:0">';
          html +=
            '<label for="' +
            inputId +
            '" style="background:' +
            (isUploaded ? "#f0fdf4" : "#f4f6fb") +
            ";color:" +
            (isUploaded ? "#059669" : "#374151") +
            ";border:1px solid " +
            (isUploaded ? "#86efac" : "#e5e7eb") +
            ';padding:6px 12px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap">&#128193; ' +

            '<label style="display:flex;align-items:center;gap:6px;cursor:pointer;padding:6px 10px;border:1px solid ' +
            (isUploaded ? "#86efac" : "#e5e7eb") +
            ';border-radius:6px;background:white;font-size:12px;color:#374151;white-space:nowrap">';
          html +=
            '<input type="checkbox" ' +
            (isUploaded ? "checked" : "") +
            " onchange=\"toggleDoc('" +
            safeDoc +
            '\');render()" style="width:14px;height:14px;accent-color:#123f7a;cursor:pointer"/> Ready</label>';
          html += "</div></div></div>";
        });
        html +=
          '<div style="background:#F4F6FB;border:1px solid #e5e7eb;border-radius:8px;padding:13px 16px;font-size:13px;color:#6b7280;margin-top:4px;line-height:1.6">&#128161; <strong>Tip:</strong> Tick "Ready" to confirm you have the document available. You can also email documents to <strong>admissions@eduhub.ac.za</strong> quoting your student number.</div>';
        return html;
      }

  <div style="font-weight:700;font-size:15px;color:#001A4D;margin-bottom:10px">Who is financially responsible? <span class="required">*</span></div>
  <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:12px">
    <label style="display:flex;align-items:center;gap:10px;cursor:pointer;padding:10px 14px;border:1.5px solid ${f.payerType === "self" ? "#123f7a" : "#e5e7eb"};border-radius:8px;background:${f.payerType === "self" ? "#EEF2FF" : "white"}">
      <input type="radio" name="payer-type" value="self" ${f.payerType === "self" ? "checked" : ""} onchange="setAndRender('payerType','self')" style="accent-color:#123f7a"/>
      <span style="font-weight:600;font-size:14px;color:#001A4D">Self-pay student</span>
    </label>
    <label style="display:flex;align-items:center;gap:10px;cursor:pointer;padding:10px 14px;border:1.5px solid ${f.payerType === "guardian" ? "#123f7a" : "#e5e7eb"};border-radius:8px;background:${f.payerType === "guardian" ? "#EEF2FF" : "white"}">
      <input type="radio" name="payer-type" value="guardian" ${f.payerType === "guardian" ? "checked" : ""} onchange="setAndRender('payerType','guardian')" style="accent-color:#123f7a"/>
      <span style="font-weight:600;font-size:14px;color:#001A4D">Parent/guardian</span>
    </label>
    <label style="display:flex;align-items:center;gap:10px;cursor:pointer;padding:10px 14px;border:1.5px solid ${f.payerType === "sponsor_company" ? "#123f7a" : "#e5e7eb"};border-radius:8px;background:${f.payerType === "sponsor_company" ? "#EEF2FF" : "white"}">
      <input type="radio" name="payer-type" value="sponsor_company" ${f.payerType === "sponsor_company" ? "checked" : ""} onchange="setAndRender('payerType','sponsor_company')" style="accent-color:#123f7a"/>
      <span style="font-weight:600;font-size:14px;color:#001A4D">Company sponsor</span>
    </label>
  </div>
  ${errSpan("payerType")}
  <div class="form-row">
    <div class="form-group"><label class="form-label">Next of Kin Full Name <span class="required">*</span></label>${inp("payerName", "Full name")}${errSpan("payerName")}</div>
    <div class="form-group"><label class="form-label">Relationship <span class="required">*</span></label>
      <select onchange="set('payerRelation',this.value)" style="width:100%;padding:10px 14px;border:1.5px solid ${state.errors.payerRelation ? "#dc2626" : "#e5e7eb"};border-radius:8px;font-size:14px;background:white">
        <option value="">Select...</option>
        ${getPayerRelationships()
          .map(
            (r) =>
              `<option value="${r}" ${f.payerRelation === r ? "selected" : ""}>${r}</option>`,
          )
          .join("")}
      </select>${errSpan("payerRelation")}
    </div>
  </div>
  <div class="form-row">
    <div class="form-group"><label class="form-label">Phone/Cell <span class="required">*</span></label>${inp("payerPhone", "+27 XX XXX XXXX", "tel")}${errSpan("payerPhone")}</div>
    <div class="form-group"><label class="form-label">Email ${isGuardian || isCompanySponsor ? '<span class="required">*</span>' : ""}</label>${inp("payerEmail", "payer@example.com", "email")}${errSpan("payerEmail")}</div>
  </div>
  ${
    isGuardian
      ? `<div class="form-row">
    <div class="form-group"><label class="form-label">Guardian ID Number <span class="required">*</span></label><input value="${f.guardianIdNumber || ""}" oninput="set('guardianIdNumber',this.value.replace(/\\D/g,'').slice(0,13))" maxlength="13" placeholder="e.g. 8001015009087" style="width:100%;padding:10px 14px;border:1.5px solid ${state.errors.guardianIdNumber ? "#dc2626" : "#e5e7eb"};border-radius:8px;font-size:14px"/>${errSpan("guardianIdNumber")}</div>
    <div class="form-group"><label class="form-label">Billing/Residential Address <span class="required">*</span></label>${inp("payerAddress", "Street, suburb, city")}${errSpan("payerAddress")}</div>
  </div>
  <label style="display:flex;align-items:flex-start;gap:12px;cursor:pointer;margin-top:4px">
    <input type="checkbox" ${f.popiaAccepted ? "checked" : ""} onchange="setAndRender('popiaAccepted',this.checked)" style="width:16px;height:16px;margin-top:2px;accent-color:#123f7a;flex-shrink:0"/>
    <span style="font-size:13px;color:#6b7280;line-height:1.6">I confirm POPIA consent for storing and processing the responsible person information for billing and admissions processing.</span>
  </label>
  ${errSpan("popiaAccepted")}`
      : isCompanySponsor
        ? `<div class="form-row">
    <div class="form-group"><label class="form-label">Company Name <span class="required">*</span></label>${inp("sponsorCompanyName", "Company legal name")}${errSpan("sponsorCompanyName")}</div>
    <div class="form-group"><label class="form-label">Company Registration Number <span class="required">*</span></label><input value="${f.sponsorRegistrationNumber || ""}" oninput="set('sponsorRegistrationNumber',this.value.toUpperCase().replace(/\\s+/g,''))" placeholder="e.g. 2019/123456/07" style="width:100%;padding:10px 14px;border:1.5px solid ${state.errors.sponsorRegistrationNumber ? "#dc2626" : "#e5e7eb"};border-radius:8px;font-size:14px"/>${errSpan("sponsorRegistrationNumber")}</div>
  </div>
  <div class="form-group"><label class="form-label">Company Billing Address <span class="required">*</span></label>${inp("payerAddress", "Street, suburb, city")}${errSpan("payerAddress")}</div>
  <label style="display:flex;align-items:flex-start;gap:12px;cursor:pointer;margin-top:4px">
    <input type="checkbox" ${f.popiaAccepted ? "checked" : ""} onchange="setAndRender('popiaAccepted',this.checked)" style="width:16px;height:16px;margin-top:2px;accent-color:#123f7a;flex-shrink:0"/>
    <span style="font-size:13px;color:#6b7280;line-height:1.6">I confirm POPIA consent for storing and processing company sponsor and contact information.</span>
  </label>
  ${errSpan("popiaAccepted")}`
        : `<div style="background:#EEF2FF;border:1px solid #C7D2FE;border-radius:8px;padding:12px 14px;font-size:13px;color:#3730a3">Next of kin details are captured for institutional records even when the student self-pays.</div>`
  }`;
      }

      function renderPaymentStep() {
        const f = state.form;
        return `<div class="form-section-header"><span style="font-size:20px">💸</span><h3 style="font-weight:700;font-size:16px;color:#001A4D">Pay Application and Submit</h3></div>
  ${renderReviewSection("Final Declarations", [
    ["Application Type", state.appType === "other" ? "Other" : "New Student"],
    ["Qualification", f.qualificationName || f.qualificationCode],
    [
      "Campus",
      state.qualificationCampuses.find((c) => c.id === f.campusId)?.name ||
        "Auto/Not selected",
    ],
    ["Admission For", state.admissionFor],
    ["Start Semester", state.admissionStartSemester],
    ["Responsible Person", f.payerName],
    [
      "Payer Type",
      f.payerType === "guardian"
        ? "Parent/Guardian"
        : f.payerType === "sponsor_company"
          ? "Company sponsor"
          : "Self-pay student",
    ],
  ])}
  <div style="background:#FEF3C7;border:1px solid #FDE68A;border-radius:8px;padding:12px 14px;font-size:13px;color:#92400e;margin-bottom:10px">Application fee payment is confirmed before final submit. Sibling discount processing (if applicable) is handled during institutional review.</div>
  <label style="display:flex;align-items:flex-start;gap:12px;cursor:pointer;margin-bottom:8px">
    <input type="checkbox" ${f.tcAccepted ? "checked" : ""} onchange="set('tcAccepted',this.checked)" style="width:16px;height:16px;margin-top:2px;accent-color:#123f7a;flex-shrink:0"/>
    <span style="font-size:13px;color:#6b7280;line-height:1.6">I confirm all information is accurate and accept the <strong style="color:#123f7a">Terms and Conditions</strong> before payment and submit.</span>
  </label>
  ${errSpan("tcAccepted")}
  ${state.submittingDraft ? `<div style="font-size:13px;color:#123f7a">Processing payment and submission...</div>` : ""}`;
      }

      function renderReviewSection(title, rows) {
        return `<div style="border:1px solid #e5e7eb;border-radius:8px;overflow:hidden;margin-bottom:12px">
    <div style="background:#f9fafb;padding:9px 14px;font-weight:700;font-size:13px;border-bottom:1px solid #e5e7eb">${title}</div>
    <div style="padding:12px 14px;display:flex;flex-direction:column;gap:8px">
      ${rows.map(([k, v]) => `<div style="display:flex;gap:12px;font-size:13px"><span style="color:#6b7280;min-width:130px">${k}</span><span style="font-weight:600;color:#001A4D">${v || "—"}</span></div>`).join("")}
    </div>
  </div>`;
      }

      function confirmType() {
        if (!state.appType) {
          showToast("Please select an Application Type", "error");
          return;
        }
        if (!state.admissionFor) {
          showToast("Please select admission year", "error");
          return;
        }
        if (!state.admissionStartSemester) {
          showToast("Please select start semester", "error");
          return;
        }
        if (state.appType !== "returning" && !state.form.qualificationCode) {
          showToast("Please select Course Applied For", "error");
          return;
        }
        setState({ typeConfirmed: true, step: 0 });
      }

      function handleDocFile(input, doc) {
        if (input.files && input.files[0]) {
          if (!state.form.docsUploaded.includes(doc)) {
            state.form.docsUploaded = [...state.form.docsUploaded, doc];
          }
          render();
          showToast(doc + " — file selected ✓", "success");
        }
      }
      async function startPage() {
        renderNavbar("apply");
        const app = document.getElementById("app");
        if (app) {
          app.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;min-height:220px;color:#6b7280;font-size:14px">Loading application data...</div>`;
        }
        await initReferenceData();
        if (state.form.qualificationCode) {
          await refreshQualificationCampuses();
        }
        render();
      }

      startPage();
    </script>
  </body>
</html>
