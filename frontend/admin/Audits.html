<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Audit Logs — EduHub Admin</title>
  <link rel="stylesheet" href="../shared.css"/>
  <style>
    .filter-bar {
      background: white;
      border-radius: var(--radius);
      padding: 20px 24px;
      margin-bottom: 20px;
      border: 1px solid var(--rf-border);
    }
    .filter-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 16px;
    }
    .filter-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .filter-field label {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--rf-navy);
    }
    .filter-field input,
    .filter-field select {
      padding: 9px 12px;
      border: 1px solid var(--rf-border);
      border-radius: 6px;
      font-size: 0.86rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .filter-field input:focus,
    .filter-field select:focus {
      border-color: var(--rf-blue);
    }
    .filter-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }
    .audit-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.88rem;
    }
    .audit-table th {
      background: #f9fafb;
      padding: 12px 16px;
      text-align: left;
      font-weight: 700;
      color: var(--rf-navy);
      border-bottom: 2px solid var(--rf-border);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .audit-table td {
      padding: 14px 16px;
      border-bottom: 1px solid var(--rf-border);
      color: var(--rf-gray);
    }
    .audit-table tr:hover {
      background: #f9fafb;
    }
    .action-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .action-login { background: #D1FAE5; color: #065f46; }
    .action-logout { background: #FEE2E2; color: #991b1b; }
    .action-application { background: #E0E7FF; color: #3730a3; }
    .action-registration { background: #FEF3C7; color: #92400e; }
    .action-user { background: #FCE7F3; color: #831843; }
    .action-mfa { background: #DBEAFE; color: #1e3a8a; }
    .action-default { background: #F3F4F6; color: #374151; }
    .user-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .user-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--rf-blue);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.72rem;
      font-weight: 700;
    }
    .user-details {
      display: flex;
      flex-direction: column;
    }
    .user-name {
      font-weight: 600;
      color: var(--rf-navy);
    }
    .user-email {
      font-size: 0.76rem;
      color: var(--rf-gray);
    }
    .details-btn {
      padding: 6px 12px;
      background: white;
      border: 1px solid var(--rf-border);
      border-radius: 6px;
      font-size: 0.78rem;
      cursor: pointer;
      color: var(--rf-blue);
      font-weight: 600;
      transition: all 0.15s;
    }
    .details-btn:hover {
      background: var(--rf-light);
      border-color: var(--rf-blue);
    }
    .pagination {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 20px;
      padding: 16px 24px;
      background: white;
      border-radius: var(--radius);
      border: 1px solid var(--rf-border);
    }
    .pagination-info {
      font-size: 0.86rem;
      color: var(--rf-gray);
    }
    .pagination-controls {
      display: flex;
      gap: 8px;
    }
    .pagination-btn {
      padding: 8px 16px;
      background: white;
      border: 1px solid var(--rf-border);
      border-radius: 6px;
      font-size: 0.84rem;
      cursor: pointer;
      color: var(--rf-navy);
      font-weight: 600;
      transition: all 0.15s;
    }
    .pagination-btn:hover:not(:disabled) {
      background: var(--rf-light);
      border-color: var(--rf-blue);
    }
    .pagination-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .stat-card {
      background: white;
      border-radius: var(--radius);
      padding: 20px 24px;
      border: 1px solid var(--rf-border);
    }
    .stat-value {
      font-size: 2rem;
      font-weight: 900;
      color: var(--rf-navy);
    }
    .stat-label {
      font-size: 0.82rem;
      color: var(--rf-gray);
      margin-top: 4px;
    }
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 500;
      background: rgba(18,63,122,0.45);
      backdrop-filter: blur(4px);
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.show {
      display: flex;
    }
    .modal-box {
      background: white;
      border-radius: 12px;
      padding: 30px 32px;
      width: 90%;
      max-width: 600px;
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: 0 8px 40px rgba(0,0,0,0.2);
    }
    .modal-title {
      font-weight: 900;
      font-size: 1.1rem;
      color: var(--rf-navy);
      margin-bottom: 18px;
    }
    .detail-row {
      display: grid;
      grid-template-columns: 140px 1fr;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--rf-border);
    }
    .detail-row:last-child {
      border-bottom: none;
    }
    .detail-label {
      font-weight: 700;
      font-size: 0.82rem;
      color: var(--rf-navy);
    }
    .detail-value {
      font-size: 0.86rem;
      color: var(--rf-gray);
    }
    .json-view {
      background: #f9fafb;
      border: 1px solid var(--rf-border);
      border-radius: 6px;
      padding: 12px;
      font-family: 'Courier New', monospace;
      font-size: 0.78rem;
      max-height: 200px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }
  </style>
</head>
<body>
<div id="navbar-placeholder"></div>
<div class="main-content">
  <h1 class="section-title">🔍 AUDIT LOGS</h1>
  <p class="section-subtitle">Track all system activities and administrative actions</p>

  <!-- Statistics -->
  <div class="stats-grid" id="stats"></div>

  <!-- Filters -->
  <div class="filter-bar">
    <div class="filter-row">
      <div class="filter-field">
        <label>Action Type</label>
        <select id="filterAction">
          <option value="">All Actions</option>
        </select>
      </div>
      <div class="filter-field">
        <label>Table Name</label>
        <select id="filterTable">
          <option value="">All Tables</option>
        </select>
      </div>
      <div class="filter-field">
        <label>Start Date</label>
        <input type="date" id="filterStartDate"/>
      </div>
      <div class="filter-field">
        <label>End Date</label>
        <input type="date" id="filterEndDate"/>
      </div>
    </div>
    <div class="filter-actions">
      <button class="btn btn-secondary" onclick="clearFilters()">Clear Filters</button>
      <button class="btn btn-primary" onclick="applyFilters()">Apply Filters</button>
    </div>
  </div>

  <!-- Audit Table -->
  <div class="card">
    <div class="card-header">
      <span style="font-weight:700;font-size:15px">Audit Trail</span>
      <span id="totalCount" style="font-size:13px;color:var(--rf-gray)"></span>
    </div>
    <div style="overflow-x:auto">
      <table class="audit-table" id="auditTable">
        <thead>
          <tr>
            <th>Timestamp</th>
            <th>User</th>
            <th>Action</th>
            <th>Table</th>
            <th>IP Address</th>
            <th>Details</th>
          </tr>
        </thead>
        <tbody id="auditBody">
          <tr>
            <td colspan="6" style="text-align:center;padding:40px;color:var(--rf-gray)">
              Loading audit logs...
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Pagination -->
  <div class="pagination">
    <div class="pagination-info" id="paginationInfo">Showing 0 of 0</div>
    <div class="pagination-controls">
      <button class="pagination-btn" id="prevBtn" onclick="previousPage()" disabled>← Previous</button>
      <button class="pagination-btn" id="nextBtn" onclick="nextPage()" disabled>Next →</button>
    </div>
  </div>
</div>

<!-- Details Modal -->
<div class="modal-overlay" id="detailsModal">
  <div class="modal-box">
    <div class="modal-title" id="modalTitle">Audit Log Details</div>
    <div id="modalContent"></div>
    <div style="margin-top:24px;text-align:right">
      <button class="btn btn-secondary" onclick="closeDetailsModal()">Close</button>
    </div>
  </div>
</div>

<script src="../shared.js"></script>
<script>
  const user = requireAuth('admin');
  renderNavbar('audits');

  let currentPage = 0;
  const pageSize = 50;
  let currentFilters = {};
  let totalLogs = 0;

  // Load filter options
  async function loadFilterOptions() {
    try {
      // Load actions
      const actionsRes = await apiCall('/audit/actions', 'GET');
      if (actionsRes.ok && actionsRes.data) {
        const actionSelect = document.getElementById('filterAction');
        actionsRes.data.forEach(action => {
          const option = document.createElement('option');
          option.value = action;
          option.textContent = action.replace(/_/g, ' ');
          actionSelect.appendChild(option);
        });
      }

      // Load tables
      const tablesRes = await apiCall('/audit/tables', 'GET');
      if (tablesRes.ok && tablesRes.data) {
        const tableSelect = document.getElementById('filterTable');
        tablesRes.data.forEach(table => {
          const option = document.createElement('option');
          option.value = table;
          option.textContent = table;
          tableSelect.appendChild(option);
        });
      }
    } catch (error) {
      console.error('Failed to load filter options:', error);
    }
  }

  // Load statistics
  async function loadStats() {
    try {
      const res = await apiCall('/audit/stats', 'GET');
      if (res.ok && res.data) {
        const stats = res.data;
        document.getElementById('stats').innerHTML = `
          <div class="stat-card">
            <div class="stat-value">${parseInt(stats.total_events || 0).toLocaleString()}</div>
            <div class="stat-label">Total Events</div>
          </div>
          <div class="stat-card">
            <div class="stat-value">${parseInt(stats.unique_users || 0).toLocaleString()}</div>
            <div class="stat-label">Unique Users</div>
          </div>
          <div class="stat-card">
            <div class="stat-value">${parseInt(stats.login_events || 0).toLocaleString()}</div>
            <div class="stat-label">Login Events</div>
          </div>
          <div class="stat-card">
            <div class="stat-value">${parseInt(stats.application_events || 0).toLocaleString()}</div>
            <div class="stat-label">Application Events</div>
          </div>
          <div class="stat-card">
            <div class="stat-value">${parseInt(stats.user_management_events || 0).toLocaleString()}</div>
            <div class="stat-label">User Management</div>
          </div>
        `;
      }
    } catch (error) {
      console.error('Failed to load stats:', error);
    }
  }

  // Load audit logs
  async function loadAuditLogs() {
    try {
      const params = new URLSearchParams({
        limit: pageSize,
        offset: currentPage * pageSize,
        ...currentFilters
      });

      const res = await apiCall(`/audit/logs?${params}`, 'GET');

      if (res.ok && res.data) {
        const { logs, total, hasMore } = res.data;
        totalLogs = total;

        document.getElementById('totalCount').textContent = `${total} total records`;

        const tbody = document.getElementById('auditBody');
        if (logs.length === 0) {
          tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;padding:40px;color:var(--rf-gray)">No audit logs found</td></tr>`;
        } else {
          tbody.innerHTML = logs.map(log => {
            const actionClass = getActionClass(log.action);
            const userName = log.first_name && log.last_name
              ? `${log.first_name} ${log.last_name}`
              : log.user_email || 'System';
            const initials = userName.split(' ').map(n => n[0]).join('').toUpperCase().substring(0, 2) || 'SY';
            const timestamp = new Date(log.created_at).toLocaleString('en-ZA', {
              year: 'numeric',
              month: 'short',
              day: 'numeric',
              hour: '2-digit',
              minute: '2-digit'
            });

            return `<tr>
              <td style="white-space:nowrap">${timestamp}</td>
              <td>
                <div class="user-info">
                  <div class="user-avatar">${initials}</div>
                  <div class="user-details">
                    <span class="user-name">${userName}</span>
                    ${log.user_email ? `<span class="user-email">${log.user_email}</span>` : ''}
                  </div>
                </div>
              </td>
              <td><span class="action-badge ${actionClass}">${log.action.replace(/_/g, ' ')}</span></td>
              <td>${log.table_name || '-'}</td>
              <td>${log.ip_address || '-'}</td>
              <td>
                <button class="details-btn" onclick='showDetails(${JSON.stringify(log).replace(/'/g, "&#39;")})'>
                  View Details
                </button>
              </td>
            </tr>`;
          }).join('');
        }

        // Update pagination
        const start = currentPage * pageSize + 1;
        const end = Math.min((currentPage + 1) * pageSize, total);
        document.getElementById('paginationInfo').textContent = total > 0
          ? `Showing ${start}-${end} of ${total}`
          : 'No results';

        document.getElementById('prevBtn').disabled = currentPage === 0;
        document.getElementById('nextBtn').disabled = !hasMore;
      }
    } catch (error) {
      console.error('Failed to load audit logs:', error);
      showToast('Failed to load audit logs', 'error');
    }
  }

  function getActionClass(action) {
    if (action.includes('LOGIN')) return 'action-login';
    if (action.includes('LOGOUT')) return 'action-logout';
    if (action.includes('APPLICATION')) return 'action-application';
    if (action.includes('REGISTRATION')) return 'action-registration';
    if (action.includes('USER')) return 'action-user';
    if (action.includes('MFA')) return 'action-mfa';
    return 'action-default';
  }

  function showDetails(log) {
    const modal = document.getElementById('detailsModal');
    const content = document.getElementById('modalContent');

    const timestamp = new Date(log.created_at).toLocaleString('en-ZA', {
      year: 'numeric',
      month: 'long',
      day: 'numeric',
      hour: '2-digit',
      minute: '2-digit',
      second: '2-digit'
    });

    let html = `
      <div class="detail-row">
        <div class="detail-label">Timestamp</div>
        <div class="detail-value">${timestamp}</div>
      </div>
      <div class="detail-row">
        <div class="detail-label">Action</div>
        <div class="detail-value">${log.action.replace(/_/g, ' ')}</div>
      </div>
      <div class="detail-row">
        <div class="detail-label">User</div>
        <div class="detail-value">${log.user_email || 'System'} ${log.user_role ? `(${log.user_role})` : ''}</div>
      </div>
      <div class="detail-row">
        <div class="detail-label">IP Address</div>
        <div class="detail-value">${log.ip_address || 'N/A'}</div>
      </div>
    `;

    if (log.table_name) {
      html += `
        <div class="detail-row">
          <div class="detail-label">Table</div>
          <div class="detail-value">${log.table_name}</div>
        </div>
      `;
    }

    if (log.record_id) {
      html += `
        <div class="detail-row">
          <div class="detail-label">Record ID</div>
          <div class="detail-value">${log.record_id}</div>
        </div>
      `;
    }

    if (log.old_data) {
      html += `
        <div class="detail-row">
          <div class="detail-label">Old Data</div>
          <div class="detail-value"><div class="json-view">${JSON.stringify(log.old_data, null, 2)}</div></div>
        </div>
      `;
    }

    if (log.new_data) {
      html += `
        <div class="detail-row">
          <div class="detail-label">New Data</div>
          <div class="detail-value"><div class="json-view">${JSON.stringify(log.new_data, null, 2)}</div></div>
        </div>
      `;
    }

    if (log.user_agent) {
      html += `
        <div class="detail-row">
          <div class="detail-label">User Agent</div>
          <div class="detail-value" style="word-break:break-all">${log.user_agent}</div>
        </div>
      `;
    }

    content.innerHTML = html;
    modal.classList.add('show');
  }

  function closeDetailsModal() {
    document.getElementById('detailsModal').classList.remove('show');
  }

  function applyFilters() {
    currentFilters = {};

    const action = document.getElementById('filterAction').value;
    const table = document.getElementById('filterTable').value;
    const startDate = document.getElementById('filterStartDate').value;
    const endDate = document.getElementById('filterEndDate').value;

    if (action) currentFilters.action = action;
    if (table) currentFilters.tableName = table;
    if (startDate) currentFilters.startDate = startDate;
    if (endDate) currentFilters.endDate = endDate;

    currentPage = 0;
    loadAuditLogs();
  }

  function clearFilters() {
    document.getElementById('filterAction').value = '';
    document.getElementById('filterTable').value = '';
    document.getElementById('filterStartDate').value = '';
    document.getElementById('filterEndDate').value = '';
    currentFilters = {};
    currentPage = 0;
    loadAuditLogs();
  }

  function previousPage() {
    if (currentPage > 0) {
      currentPage--;
      loadAuditLogs();
    }
  }

  function nextPage() {
    if ((currentPage + 1) * pageSize < totalLogs) {
      currentPage++;
      loadAuditLogs();
    }
  }

  // Close modal when clicking outside
  document.getElementById('detailsModal').addEventListener('click', function(e) {
    if (e.target === this) closeDetailsModal();
  });

  // Initialize
  (async () => {
    await loadFilterOptions();
    await loadStats();
    await loadAuditLogs();
  })();
</script>
</body>
</html>
