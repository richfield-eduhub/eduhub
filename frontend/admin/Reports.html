<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Reports & Analytics — EduHub Admin</title>
  <link rel="stylesheet" href="../shared.css"/>
  <style>
    .tab-btn{padding:9px 20px;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer;border:1.5px solid var(--rf-border);background:white;color:var(--rf-navy);transition:all .15s}
    .tab-btn.active{background:var(--rf-blue);color:white;border-color:var(--rf-blue)}
    .bar{height:28px;border-radius:4px;transition:width .5s;display:flex;align-items:center;padding:0 10px;font-size:12px;font-weight:700;color:white;min-width:36px}
    .chart-bar { height: 32px; background: var(--rf-blue); border-radius: 4px; display: flex; align-items: center; padding: 0 12px; color: white; font-weight: 700; font-size: 13px; transition: width 0.3s; }
  </style>
</head>
<body>
<div id="navbar-root"></div>
<div class="main-content">
  <h1 class="section-title">REPORTS & ANALYTICS</h1>
  <p class="section-subtitle">System-wide statistics, trends and insights</p>

  <!-- Summary stats -->
  <div class="grid-4 mb-24" id="summary-stats">
    <div class="stat-card">
      <div class="spinner" style="width:30px;height:30px"></div>
      <div class="stat-label">Loading...</div>
    </div>
  </div>

  <!-- Tab nav -->
  <div style="display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap">
    <button class="tab-btn active" data-tab="enrollment" onclick="showTab('enrollment',this)">📊 Enrollment</button>
    <button class="tab-btn" data-tab="applications" onclick="showTab('applications',this)">📋 Application Funnel</button>
    <button class="tab-btn" data-tab="usage" onclick="showTab('usage',this)">📈 System Usage</button>
  </div>

  <div id="tab-content">
    <div style="text-align:center;padding:40px">
      <div class="spinner"></div>
      <p style="color:var(--rf-gray);margin-top:12px">Loading report data...</p>
    </div>
  </div>
</div>

<script src="../shared.js"></script>
<script>
requireAuth(ROLES.ADMIN);
renderNavbar('admin-reports');

let enrollmentData = null;
let applicationData = null;
let usageData = null;
let currentTab = 'enrollment';

// Load all report data
loadReports();

async function loadReports() {
  const currentUser = getCurrentUser();
  const headers = {
    'Authorization': `Bearer ${currentUser.accessToken}`,
  };

  try {
    // Load all reports in parallel
    const [enrollmentRes, applicationRes, usageRes] = await Promise.all([
      fetch(`${APP_CONFIG.API_URL}/admin/reports/enrollment`, { headers }),
      fetch(`${APP_CONFIG.API_URL}/admin/reports/applications`, { headers }),
      fetch(`${APP_CONFIG.API_URL}/admin/reports/system-usage`, { headers }),
    ]);

    if (enrollmentRes.ok) {
      const data = await enrollmentRes.json();
      enrollmentData = data.data;
    }

    if (applicationRes.ok) {
      const data = await applicationRes.json();
      applicationData = data.data;
    }

    if (usageRes.ok) {
      const data = await usageRes.json();
      usageData = data.data;
    }

    // Render summary stats
    renderSummaryStats();

    // Show initial tab
    showTab(currentTab, document.querySelector('.tab-btn.active'));
  } catch (error) {
    console.error('Error loading reports:', error);
    document.getElementById('tab-content').innerHTML = `
      <div class="card">
        <div class="card-body" style="text-align:center;padding:40px">
          <div style="font-size:48px;margin-bottom:16px">⚠️</div>
          <h3 style="color:var(--rf-navy);margin-bottom:8px">Failed to Load Reports</h3>
          <p style="color:var(--rf-gray)">Please refresh the page to try again.</p>
        </div>
      </div>`;
  }
}

function renderSummaryStats() {
  const stats = [];

  if (applicationData) {
    stats.push({
      icon: '📋',
      label: 'Total Applications',
      value: applicationData.summary.total_applications,
      bg: '#FEF3C7'
    });
  }

  if (enrollmentData && enrollmentData.total_students) {
    stats.push({
      icon: '🎓',
      label: 'Total Students',
      value: enrollmentData.total_students,
      bg: '#D1FAE5'
    });
  }

  if (usageData && usageData.total_users) {
    stats.push({
      icon: '👥',
      label: 'Total Users',
      value: usageData.total_users,
      bg: '#E0E7FF'
    });
  }

  if (enrollmentData && enrollmentData.total_registrations) {
    stats.push({
      icon: '📚',
      label: 'Total Registrations',
      value: enrollmentData.total_registrations,
      bg: '#FCE7F3'
    });
  }

  if (stats.length > 0) {
    document.getElementById('summary-stats').innerHTML = stats.map(s => `
      <div class="stat-card">
        <div class="stat-icon" style="background:${s.bg}">
          <span style="font-size:22px">${s.icon}</span>
        </div>
        <div>
          <div class="stat-value">${s.value.toLocaleString()}</div>
          <div class="stat-label">${s.label}</div>
        </div>
      </div>
    `).join('');
  }
}

function showTab(tab, btn) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');

  if (tab === 'enrollment') {
    renderEnrollmentReport();
  } else if (tab === 'applications') {
    renderApplicationReport();
  } else if (tab === 'usage') {
    renderUsageReport();
  }
}

function renderEnrollmentReport() {
  if (!enrollmentData) {
    document.getElementById('tab-content').innerHTML = '<div class="card"><div class="card-body">Loading enrollment data...</div></div>';
    return;
  }

  const byQual = enrollmentData.by_qualification || [];
  const byModule = enrollmentData.by_module || [];
  const maxQual = Math.max(...byQual.map(q => parseInt(q.student_count)), 1);
  const maxModule = Math.max(...byModule.map(m => parseInt(m.student_count)), 1);

  document.getElementById('tab-content').innerHTML = `
    <div class="grid-2">
      <div class="card">
        <div class="card-header">
          <span style="font-weight:700">Enrollment by Qualification</span>
        </div>
        <div class="card-body">
          ${byQual.length === 0
            ? '<p style="color:var(--rf-gray);text-align:center;padding:20px">No enrollment data available</p>'
            : byQual.map(q => {
                const width = Math.max(5, Math.round((parseInt(q.student_count) / maxQual) * 100));
                return `
                  <div style="margin-bottom:12px">
                    <div style="display:flex;justify-content:space-between;margin-bottom:4px">
                      <span style="font-size:13px;font-weight:600;color:var(--rf-navy)">${escapeHtml(q.qualification_name || q.qualification_code)}</span>
                      <span style="font-size:13px;font-weight:700;color:var(--rf-blue)">${q.student_count} students</span>
                    </div>
                    <div style="background:#f3f4f6;border-radius:4px;overflow:hidden;height:28px">
                      <div class="chart-bar" style="width:${width}%">${q.student_count}</div>
                    </div>
                  </div>
                `;
              }).join('')
          }
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <span style="font-weight:700">Enrollment by Module</span>
        </div>
        <div class="card-body" style="max-height:600px;overflow-y:auto">
          ${byModule.length === 0
            ? '<p style="color:var(--rf-gray);text-align:center;padding:20px">No module data available</p>'
            : byModule.slice(0, 15).map(m => {
                const width = Math.max(5, Math.round((parseInt(m.student_count) / maxModule) * 100));
                return `
                  <div style="margin-bottom:12px">
                    <div style="display:flex;justify-content:space-between;margin-bottom:4px">
                      <span style="font-size:13px;font-weight:600;color:var(--rf-navy)">${escapeHtml(m.module_code)} - ${escapeHtml(m.module_name)}</span>
                      <span style="font-size:13px;font-weight:700;color:var(--rf-blue)">${m.student_count}</span>
                    </div>
                    <div style="background:#f3f4f6;border-radius:4px;overflow:hidden;height:24px">
                      <div class="chart-bar" style="width:${width}%;height:24px;font-size:12px">${m.student_count}</div>
                    </div>
                  </div>
                `;
              }).join('')
          }
          ${byModule.length > 15 ? `<p style="color:var(--rf-gray);font-size:12px;margin-top:12px">Showing top 15 of ${byModule.length} modules</p>` : ''}
        </div>
      </div>
    </div>
  `;
}

function renderApplicationReport() {
  if (!applicationData) {
    document.getElementById('tab-content').innerHTML = '<div class="card"><div class="card-body">Loading application data...</div></div>';
    return;
  }

  const summary = applicationData.summary;
  const byStatus = applicationData.by_status || [];
  const total = parseInt(summary.total_applications);

  document.getElementById('tab-content').innerHTML = `
    <div class="grid-2">
      <div class="card">
        <div class="card-header">
          <span style="font-weight:700">Application Funnel</span>
        </div>
        <div class="card-body">
          <div style="text-align:center;margin-bottom:24px">
            <div style="font-size:48px;font-weight:900;color:var(--rf-navy)">${summary.total_applications}</div>
            <div style="font-size:14px;color:var(--rf-gray)">Total Applications</div>
          </div>

          ${byStatus.map(status => {
            const count = parseInt(status.count);
            const percentage = total > 0 ? Math.round((count / total) * 100) : 0;
            const width = Math.max(5, percentage);

            const statusColors = {
              pending: { bg: '#FEF3C7', color: '#92400e', label: '⏳ Pending' },
              approved: { bg: '#D1FAE5', color: '#065f46', label: '✅ Approved' },
              rejected: { bg: '#FEE2E2', color: '#991B1B', label: '❌ Rejected' },
              under_review: { bg: '#E0E7FF', color: '#1e40af', label: '🔍 Under Review' }
            };

            const config = statusColors[status.status] || { bg: '#F3F4F6', color: '#6B7280', label: status.status };

            return `
              <div style="margin-bottom:16px">
                <div style="display:flex;justify-content:space-between;margin-bottom:6px">
                  <span style="font-size:14px;font-weight:700;color:${config.color}">${config.label}</span>
                  <span style="font-size:14px;font-weight:700;color:var(--rf-navy)">${count} (${percentage}%)</span>
                </div>
                <div style="background:#f3f4f6;border-radius:6px;overflow:hidden;height:32px">
                  <div style="width:${width}%;height:100%;background:${config.bg};border:2px solid ${config.color};border-radius:6px;display:flex;align-items:center;padding:0 12px;transition:width 0.3s">
                    <span style="font-size:13px;font-weight:700;color:${config.color}">${count}</span>
                  </div>
                </div>
              </div>
            `;
          }).join('')}

          <div style="margin-top:24px;padding-top:16px;border-top:2px solid var(--rf-border)">
            <div style="display:flex;justify-content:space-between;font-size:14px">
              <span style="color:var(--rf-gray)">Approval Rate:</span>
              <span style="font-weight:800;color:var(--rf-navy)">${summary.approval_rate}%</span>
            </div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <span style="font-weight:700">Key Metrics</span>
        </div>
        <div class="card-body">
          <div style="display:grid;gap:16px">
            <div style="padding:16px;background:#F9FAFB;border-radius:8px">
              <div style="font-size:11px;font-weight:700;color:var(--rf-gray);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px">Pending Applications</div>
              <div style="font-size:32px;font-weight:900;color:#f59e0b">${byStatus.find(s => s.status === 'pending')?.count || 0}</div>
              <div style="font-size:12px;color:var(--rf-gray);margin-top:4px">Awaiting review</div>
            </div>

            <div style="padding:16px;background:#F9FAFB;border-radius:8px">
              <div style="font-size:11px;font-weight:700;color:var(--rf-gray);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px">Approved</div>
              <div style="font-size:32px;font-weight:900;color:#059669">${byStatus.find(s => s.status === 'approved')?.count || 0}</div>
              <div style="font-size:12px;color:var(--rf-gray);margin-top:4px">Successfully approved</div>
            </div>

            <div style="padding:16px;background:#F9FAFB;border-radius:8px">
              <div style="font-size:11px;font-weight:700;color:var(--rf-gray);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px">Rejected</div>
              <div style="font-size:32px;font-weight:900;color:#dc2626">${byStatus.find(s => s.status === 'rejected')?.count || 0}</div>
              <div style="font-size:12px;color:var(--rf-gray);margin-top:4px">Not approved</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  `;
}

function renderUsageReport() {
  if (!usageData) {
    document.getElementById('tab-content').innerHTML = '<div class="card"><div class="card-body">Loading usage data...</div></div>';
    return;
  }

  const byRole = usageData.by_role || [];
  const byMonth = usageData.registrations_by_month || [];

  document.getElementById('tab-content').innerHTML = `
    <div class="grid-2">
      <div class="card">
        <div class="card-header">
          <span style="font-weight:700">Users by Role</span>
        </div>
        <div class="card-body">
          <div style="text-align:center;margin-bottom:24px">
            <div style="font-size:48px;font-weight:900;color:var(--rf-navy)">${usageData.total_users}</div>
            <div style="font-size:14px;color:var(--rf-gray)">Total Users</div>
          </div>

          ${byRole.map(role => {
            const count = parseInt(role.user_count);
            const percentage = usageData.total_users > 0 ? Math.round((count / usageData.total_users) * 100) : 0;
            const width = Math.max(5, percentage);

            const roleColors = {
              student: { color: '#059669', emoji: '🎓' },
              lecturer: { color: '#3b82f6', emoji: '👨‍🏫' },
              admin: { color: '#dc2626', emoji: '👑' }
            };

            const config = roleColors[role.role] || { color: '#6B7280', emoji: '👤' };

            return `
              <div style="margin-bottom:14px">
                <div style="display:flex;justify-content:space-between;margin-bottom:6px">
                  <span style="font-size:14px;font-weight:700;color:var(--rf-navy)">
                    ${config.emoji} ${role.role.charAt(0).toUpperCase() + role.role.slice(1)}s
                  </span>
                  <span style="font-size:14px;font-weight:700;color:${config.color}">${count} (${percentage}%)</span>
                </div>
                <div style="background:#f3f4f6;border-radius:4px;overflow:hidden;height:28px">
                  <div class="chart-bar" style="width:${width}%;background:${config.color}">${count}</div>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <span style="font-weight:700">Registrations by Month</span>
        </div>
        <div class="card-body">
          ${byMonth.length === 0
            ? '<p style="color:var(--rf-gray);text-align:center;padding:20px">No registration data available</p>'
            : (() => {
                const maxCount = Math.max(...byMonth.map(m => parseInt(m.registration_count)), 1);
                return byMonth.map(month => {
                  const count = parseInt(month.registration_count);
                  const width = Math.max(5, Math.round((count / maxCount) * 100));
                  const date = new Date(month.month);
                  const monthName = date.toLocaleDateString('en-ZA', { month: 'long', year: 'numeric' });

                  return `
                    <div style="margin-bottom:12px">
                      <div style="display:flex;justify-content:space-between;margin-bottom:4px">
                        <span style="font-size:13px;font-weight:600;color:var(--rf-navy)">${monthName}</span>
                        <span style="font-size:13px;font-weight:700;color:var(--rf-blue)">${count} registrations</span>
                      </div>
                      <div style="background:#f3f4f6;border-radius:4px;overflow:hidden;height:24px">
                        <div class="chart-bar" style="width:${width}%;height:24px;font-size:12px">${count}</div>
                      </div>
                    </div>
                  `;
                }).join('');
              })()
          }
        </div>
      </div>
    </div>
  `;
}

function escapeHtml(text) {
  if (!text) return '';
  const map = {
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#039;'
  };
  return text.replace(/[&<>"']/g, m => map[m]);
}
</script>
</body>
</html>
