<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduHub - Server Error</title>
  <link rel="stylesheet" href="/shared.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #f5f7fa; }
    .error-box { text-align: center; padding: 3rem; background: white; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); max-width: 480px; }
    .error-code { font-size: 5rem; font-weight: 700; color: #e53e3e; margin: 0; }
    h2 { color: #2d3748; margin: 0.5rem 0; }
    p { color: #718096; }
    a { color: #3182ce; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <div class="error-box">
    <p class="error-code">5xx</p>
    <h2>Server Error</h2>
    <p>Something went wrong on our end. Please try again in a moment.</p>
    <p><a href="/">← Back to Home</a></p>
  </div>
</body>
</html>
