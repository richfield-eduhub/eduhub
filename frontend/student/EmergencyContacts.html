<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Emergency Contacts — EduHub</title>
  <link rel="stylesheet" href="../shared.css"/>
  <style>
    .contact-card { border: 2px solid var(--rf-border); border-radius: 12px; padding: 20px; margin-bottom: 16px; position: relative; }
    .contact-card.primary { border-color: var(--rf-blue); background: rgba(0,122,204,0.02); }
    .primary-badge { background: var(--rf-blue); color: white; padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
    .contact-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .contact-info { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
    .info-label { font-size: 11px; font-weight: 700; color: var(--rf-gray); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
    .info-value { font-size: 15px; color: var(--rf-navy); font-weight: 600; }
    .empty-state { text-align: center; padding: 60px 20px; }
    .empty-state-icon { font-size: 64px; margin-bottom: 16px; }
  </style>
</head>
<body>
<div id="navbar-root"></div>
<div class="main-content" style="max-width:960px">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:24px">
    <div>
      <h1 class="section-title">EMERGENCY CONTACTS</h1>
      <p class="section-subtitle">Manage up to 3 emergency contacts for quick access in case of emergencies</p>
    </div>
    <button id="add-contact-btn" class="btn btn-primary" onclick="openAddContactModal()">
      ➕ Add Contact
    </button>
  </div>

  <!-- Contacts list -->
  <div id="contacts-container">
    <div class="empty-state" id="empty-state">
      <div class="empty-state-icon">📞</div>
      <h3 style="font-family:var(--font-display);font-size:20px;color:var(--rf-navy);margin-bottom:8px">No Emergency Contacts</h3>
      <p style="color:var(--rf-gray);margin-bottom:24px">Add emergency contacts so we can reach them if needed</p>
      <button class="btn btn-primary" onclick="openAddContactModal()">Add Your First Contact</button>
    </div>
  </div>
</div>

<!-- Add/Edit Contact Modal -->
<div id="contact-modal" class="modal">
  <div class="modal-content" style="max-width:600px">
    <div class="modal-header">
      <h3 id="modal-title">Add Emergency Contact</h3>
      <button class="modal-close" onclick="closeContactModal()">×</button>
    </div>
    <div class="modal-body">
      <div id="modal-alert"></div>
      <form id="contact-form">
        <div class="form-row" style="margin-bottom:16px">
          <div class="form-group">
            <label class="form-label">Full Name *</label>
            <input type="text" id="contact-name" class="form-input" placeholder="e.g. John Doe" required/>
          </div>
          <div class="form-group">
            <label class="form-label">Relationship *</label>
            <select id="contact-relationship" class="form-input" required>
              <option value="">Select relationship</option>
              <option value="Parent">Parent</option>
              <option value="Guardian">Guardian</option>
              <option value="Spouse">Spouse</option>
              <option value="Sibling">Sibling</option>
              <option value="Relative">Relative</option>
              <option value="Friend">Friend</option>
              <option value="Other">Other</option>
            </select>
          </div>
        </div>
        <div class="form-row" style="margin-bottom:16px">
          <div class="form-group">
            <label class="form-label">Phone Number *</label>
            <input type="tel" id="contact-phone" class="form-input" placeholder="+27 XX XXX XXXX" required/>
          </div>
          <div class="form-group">
            <label class="form-label">Alternative Phone</label>
            <input type="tel" id="contact-alt-phone" class="form-input" placeholder="+27 XX XXX XXXX"/>
          </div>
        </div>
        <div class="form-group" style="margin-bottom:16px">
          <label class="form-label">Email Address</label>
          <input type="email" id="contact-email" class="form-input" placeholder="contact@example.com"/>
        </div>
        <div class="form-group" style="margin-bottom:20px">
          <label class="form-label">Address</label>
          <input type="text" id="contact-address" class="form-input" placeholder="Street, Suburb, City"/>
        </div>
        <div style="display:flex;gap:12px">
          <button type="submit" class="btn btn-primary" id="save-contact-btn">💾 Save Contact</button>
          <button type="button" class="btn btn-secondary" onclick="closeContactModal()">Cancel</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="../shared.js"></script>
<script>
const user = requireAuth('student');
renderNavbar('student-profile');

let contacts = [];
let editingContactId = null;

// Load contacts on page load
loadContacts();

async function loadContacts() {
  try {
    const currentUser = getCurrentUser();
    const response = await fetch(`${APP_CONFIG.API_URL}/students/${currentUser.user_id}/emergency-contacts`, {
      headers: {
        'Authorization': `Bearer ${currentUser.accessToken}`,
      },
    });

    if (response.ok) {
      const data = await response.json();
      contacts = data.data || [];
      renderContacts();
    } else {
      showToast('Failed to load contacts', 'error');
    }
  } catch (error) {
    console.error('Error loading contacts:', error);
    showToast('An error occurred while loading contacts', 'error');
  }
}

function renderContacts() {
  const container = document.getElementById('contacts-container');
  const emptyState = document.getElementById('empty-state');
  const addBtn = document.getElementById('add-contact-btn');

  if (contacts.length === 0) {
    emptyState.style.display = 'block';
    addBtn.style.display = 'inline-flex';
    return;
  }

  emptyState.style.display = 'none';

  // Disable add button if already have 3 contacts
  if (contacts.length >= 3) {
    addBtn.disabled = true;
    addBtn.textContent = '✓ Maximum contacts (3)';
    addBtn.classList.add('btn-disabled');
  } else {
    addBtn.disabled = false;
    addBtn.textContent = '➕ Add Contact';
    addBtn.classList.remove('btn-disabled');
  }

  // Sort contacts to show primary first
  const sortedContacts = [...contacts].sort((a, b) => {
    if (a.is_primary) return -1;
    if (b.is_primary) return 1;
    return 0;
  });

  container.innerHTML = sortedContacts.map(contact => `
    <div class="contact-card ${contact.is_primary ? 'primary' : ''}">
      <div class="contact-header">
        <div style="display:flex;align-items:center;gap:12px">
          <div style="font-size:32px">👤</div>
          <div>
            <div style="font-size:18px;font-weight:800;color:var(--rf-navy)">${escapeHtml(contact.full_name)}</div>
            <div style="font-size:14px;color:var(--rf-gray)">${escapeHtml(contact.relationship)}</div>
          </div>
        </div>
        ${contact.is_primary ? '<span class="primary-badge">Primary Contact</span>' : ''}
      </div>

      <div class="contact-info">
        <div>
          <div class="info-label">Phone Number</div>
          <div class="info-value">${escapeHtml(contact.phone_number)}</div>
        </div>
        ${contact.alternative_phone ? `
          <div>
            <div class="info-label">Alternative Phone</div>
            <div class="info-value">${escapeHtml(contact.alternative_phone)}</div>
          </div>
        ` : ''}
        ${contact.email ? `
          <div>
            <div class="info-label">Email</div>
            <div class="info-value">${escapeHtml(contact.email)}</div>
          </div>
        ` : ''}
        ${contact.address ? `
          <div>
            <div class="info-label">Address</div>
            <div class="info-value">${escapeHtml(contact.address)}</div>
          </div>
        ` : ''}
      </div>

      <div style="display:flex;gap:8px;margin-top:16px;padding-top:16px;border-top:1px solid var(--rf-border)">
        ${!contact.is_primary ? `
          <button class="btn btn-secondary btn-sm" onclick="setPrimaryContact('${contact.id}')">⭐ Set as Primary</button>
        ` : ''}
        <button class="btn btn-secondary btn-sm" onclick="editContact('${contact.id}')">✏️ Edit</button>
        <button class="btn btn-secondary btn-sm" onclick="deleteContact('${contact.id}')" style="margin-left:auto">🗑️ Delete</button>
      </div>
    </div>
  `).join('');
}

function openAddContactModal() {
  if (contacts.length >= 3) {
    showToast('You can only have up to 3 emergency contacts', 'warning');
    return;
  }

  editingContactId = null;
  document.getElementById('modal-title').textContent = 'Add Emergency Contact';
  document.getElementById('contact-form').reset();
  clearAlert('modal-alert');
  openModal('contact-modal');
}

function editContact(contactId) {
  const contact = contacts.find(c => c.id === contactId);
  if (!contact) return;

  editingContactId = contactId;
  document.getElementById('modal-title').textContent = 'Edit Emergency Contact';
  document.getElementById('contact-name').value = contact.full_name;
  document.getElementById('contact-relationship').value = contact.relationship;
  document.getElementById('contact-phone').value = contact.phone_number;
  document.getElementById('contact-alt-phone').value = contact.alternative_phone || '';
  document.getElementById('contact-email').value = contact.email || '';
  document.getElementById('contact-address').value = contact.address || '';
  clearAlert('modal-alert');
  openModal('contact-modal');
}

async function setPrimaryContact(contactId) {
  try {
    const currentUser = getCurrentUser();
    const response = await fetch(`${APP_CONFIG.API_URL}/students/${currentUser.user_id}/emergency-contacts/${contactId}/set-primary`, {
      method: 'POST',
      headers: {
        'Authorization': `Bearer ${currentUser.accessToken}`,
      },
    });

    const data = await response.json();

    if (response.ok) {
      showToast('Primary contact updated', 'success');
      await loadContacts();
    } else {
      showToast(data.message || 'Failed to set primary contact', 'error');
    }
  } catch (error) {
    console.error('Error setting primary contact:', error);
    showToast('An error occurred', 'error');
  }
}

async function deleteContact(contactId) {
  if (!confirm('Are you sure you want to delete this emergency contact?')) {
    return;
  }

  try {
    const currentUser = getCurrentUser();
    const response = await fetch(`${APP_CONFIG.API_URL}/students/${currentUser.user_id}/emergency-contacts/${contactId}`, {
      method: 'DELETE',
      headers: {
        'Authorization': `Bearer ${currentUser.accessToken}`,
      },
    });

    const data = await response.json();

    if (response.ok) {
      showToast('Contact deleted successfully', 'success');
      await loadContacts();
    } else {
      showToast(data.message || 'Failed to delete contact', 'error');
    }
  } catch (error) {
    console.error('Error deleting contact:', error);
    showToast('An error occurred', 'error');
  }
}

function closeContactModal() {
  closeModal('contact-modal');
  editingContactId = null;
  document.getElementById('contact-form').reset();
}

// Form submission
document.getElementById('contact-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  clearAlert('modal-alert');

  const contactData = {
    full_name: document.getElementById('contact-name').value.trim(),
    relationship: document.getElementById('contact-relationship').value,
    phone_number: document.getElementById('contact-phone').value.trim(),
    alternative_phone: document.getElementById('contact-alt-phone').value.trim() || null,
    email: document.getElementById('contact-email').value.trim() || null,
    address: document.getElementById('contact-address').value.trim() || null,
  };

  try {
    const currentUser = getCurrentUser();
    const url = editingContactId
      ? `${APP_CONFIG.API_URL}/students/${currentUser.user_id}/emergency-contacts/${editingContactId}`
      : `${APP_CONFIG.API_URL}/students/${currentUser.user_id}/emergency-contacts`;

    const method = editingContactId ? 'PUT' : 'POST';

    setLoading('save-contact-btn', true, 'Saving...');

    const response = await fetch(url, {
      method: method,
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${currentUser.accessToken}`,
      },
      body: JSON.stringify(contactData),
    });

    const data = await response.json();

    if (response.ok) {
      showToast(editingContactId ? 'Contact updated successfully' : 'Contact added successfully', 'success');
      closeContactModal();
      await loadContacts();
    } else {
      showAlert('modal-alert', data.message || 'Failed to save contact', 'error');
    }
  } catch (error) {
    console.error('Error saving contact:', error);
    showAlert('modal-alert', 'An error occurred while saving the contact', 'error');
  } finally {
    setLoading('save-contact-btn', false, '💾 Save Contact');
  }
});

// Helper function to escape HTML
function escapeHtml(text) {
  if (!text) return '';
  const map = {
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#039;'
  };
  return text.replace(/[&<>"']/g, m => map[m]);
}
</script>
</body>
</html>
