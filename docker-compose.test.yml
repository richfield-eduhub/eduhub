# Isolated Postgres for integration tests (port 5434 → eduhub_test)
services:
  db_test:
    image: postgres:16
    container_name: eduhub_db_test
    environment:
      POSTGRES_DB: eduhub_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: testpassword
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eduhub_test"]
      interval: 3s
      timeout: 5s
      retries: 15
    tmpfs:
      - /var/lib/postgresql/data
