events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml font/truetype font/opentype
               application/vnd.ms-fontobject image/svg+xml;

    limit_req_zone $binary_remote_addr zone=api_limit:10m  rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;

    upstream backend {
        server backend:3000;
    }

    server {
        listen 80;
        server_name localhost _;

        client_max_body_size 10M;

        add_header X-Frame-Options    "SAMEORIGIN"  always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection   "1; mode=block" always;

        # ── Health check ──────────────────────────────────────────────
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 'ok';
        }

        # ── API routes → backend ──────────────────────────────────────
        location /api/auth/ {
            limit_req zone=auth_limit burst=10 nodelay;
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
        }

        location /api/ {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        'upgrade';
            proxy_cache_bypass $http_upgrade;
            proxy_connect_timeout 60s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
        }

        # ── Clean URL routes → HTML files ─────────────────────────────

        # Root
        location = / {
            root /usr/share/nginx/html;
            try_files /index.html =404;
        }

        # Public pages
        location = /login           { root /usr/share/nginx/html; try_files /public/Login.html =404; }
        location = /register        { root /usr/share/nginx/html; try_files /public/Register.html =404; }
        location = /forgot-password { root /usr/share/nginx/html; try_files /public/ForgotPassword.html =404; }
        location = /apply           { root /usr/share/nginx/html; try_files /public/Apply.html =404; }
        location = /programmes      { root /usr/share/nginx/html; try_files /public/Programmes.html =404; }
        location = /home            { root /usr/share/nginx/html; try_files /public/Home.html =404; }

        # Admin pages
        location = /admin                { root /usr/share/nginx/html; try_files /admin/Dashboard.html =404; }
        location = /admin/               { root /usr/share/nginx/html; try_files /admin/Dashboard.html =404; }
        location = /admin/dashboard      { root /usr/share/nginx/html; try_files /admin/Dashboard.html =404; }
        location = /admin/applications   { root /usr/share/nginx/html; try_files /admin/Applications.html =404; }
        location = /admin/registrations  { root /usr/share/nginx/html; try_files /admin/Registrations.html =404; }
        location = /admin/allocations    { root /usr/share/nginx/html; try_files /admin/Allocations.html =404; }
        location = /admin/students       { root /usr/share/nginx/html; try_files /admin/Students.html =404; }
        location = /admin/courses        { root /usr/share/nginx/html; try_files /admin/Courses.html =404; }
        location = /admin/users          { root /usr/share/nginx/html; try_files /admin/Users.html =404; }
        location = /admin/reports        { root /usr/share/nginx/html; try_files /admin/Reports.html =404; }

        # Student pages
        location = /student                 { root /usr/share/nginx/html; try_files /student/Dashboard.html =404; }
        location = /student/                { root /usr/share/nginx/html; try_files /student/Dashboard.html =404; }
        location = /student/dashboard       { root /usr/share/nginx/html; try_files /student/Dashboard.html =404; }
        location = /student/register        { root /usr/share/nginx/html; try_files /student/Register.html =404; }
        location = /student/modules         { root /usr/share/nginx/html; try_files /student/MyCourses.html =404; }
        location = /student/mycourses       { root /usr/share/nginx/html; try_files /student/MyCourses.html =404; }
        location = /student/courses         { root /usr/share/nginx/html; try_files /student/Courses.html =404; }
        location = /student/profile         { root /usr/share/nginx/html; try_files /student/Profile.html =404; }
        location = /student/applications    { root /usr/share/nginx/html; try_files /student/Applications.html =404; }

        # Lecturer pages
        location = /lecturer                    { root /usr/share/nginx/html; try_files /lecturer/Dashboard.html =404; }
        location = /lecturer/                   { root /usr/share/nginx/html; try_files /lecturer/Dashboard.html =404; }
        location = /lecturer/dashboard          { root /usr/share/nginx/html; try_files /lecturer/Dashboard.html =404; }
        location = /lecturer/courses            { root /usr/share/nginx/html; try_files /lecturer/MyCourses.html =404; }
        location = /lecturer/roster             { root /usr/share/nginx/html; try_files /lecturer/Roster.html =404; }
        location = /lecturer/announcements      { root /usr/share/nginx/html; try_files /lecturer/Announcements.html =404; }

        # ── Direct .html file access ──────────────────────────────────
        location ~* \.html$ {
            root /usr/share/nginx/html;
            try_files $uri =404;
        }

        # ── Static assets ─────────────────────────────────────────────
        location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
            root    /usr/share/nginx/html;
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # ── Block hidden files ────────────────────────────────────────
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        # ── Fallback → backend ────────────────────────────────────────
        location / {
            root  /usr/share/nginx/html;
            try_files $uri $uri/ @backend;
        }

        location @backend {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host            $host;
            proxy_set_header   X-Real-IP       $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html { root /usr/share/nginx/html; }
    }
}
