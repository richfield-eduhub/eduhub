version: "3.8"

# Production overrides - pulls images from GitHub Container Registry.
# Usage:
#   Local dev: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#   Production: docker compose -f docker-compose.infrastructure.yml -f docker-compose.app.yml -f docker-compose.prod.yml up -d

services:
  backend:
    image: ghcr.io/richfield-eduhub/eduhub-backend:latest
    environment:
      NODE_ENV: production

  nginx:
    image: ghcr.io/richfield-eduhub/eduhub-nginx:latest
