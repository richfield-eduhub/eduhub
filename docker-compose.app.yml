version: "3.8"

# Application services - auto-deployed via CI/CD
# Deploy with: docker compose -f docker-compose.infrastructure.yml -f docker-compose.app.yml up -d

services:
  # Node.js Backend API
  backend:
    container_name: eduhub_backend
    restart: unless-stopped
    command: ${BACKEND_COMMAND:-npm start}
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-eduhub}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-yourpassword}
      JWT_SECRET: ${JWT_SECRET:-change_this_to_a_secure_random_string}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change_this_refresh_secret_too}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-30d}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      - ./logs/backend:/app/logs
    depends_on:
      db:
        condition: service_healthy
      pgadmin:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - eduhub_network

  # Nginx Reverse Proxy & Static File Server
  nginx:
    container_name: eduhub_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./logs/nginx:/var/log/nginx
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost/healthz",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - eduhub_network

networks:
  eduhub_network:
    driver: bridge
    external: false
