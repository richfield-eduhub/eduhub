name: Backend Tests

on:
  workflow_call:
    inputs:
      with_coverage:
        description: Run full suite with coverage report
        type: boolean
        default: true

env:
  JWT_SECRET: ci-test-jwt-secret
  JWT_REFRESH_SECRET: ci-test-jwt-refresh-secret
  JWT_EXPIRES_IN: 7d
  DISABLE_RATE_LIMIT: 'true'

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: make test-unit
        run: make test-unit

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: eduhub_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d eduhub_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_HOST: localhost
      DB_PORT: 5434
      DB_NAME: eduhub_test
      DB_USER: postgres
      DB_PASSWORD: testpassword

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: make test-integration
        run: make test-integration

  coverage:
    name: Coverage
    if: inputs.with_coverage
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: eduhub_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d eduhub_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_HOST: localhost
      DB_PORT: 5434
      DB_NAME: eduhub_test
      DB_USER: postgres
      DB_PASSWORD: testpassword

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: make test-coverage
        run: make test-coverage

      - name: Publish coverage summary
        if: always()
        working-directory: backend
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node <<'EOF'
          const fs = require('fs');
          const summary = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8'));
          const total = summary.total;
          const rows = ['lines', 'statements', 'functions', 'branches'].map((metric) => {
            const value = total[metric];
            return `| ${metric} | ${value.covered} | ${value.total} | ${value.pct}% |`;
          });
          const body = [
            '## Backend coverage',
            '',
            '| Metric | Covered | Total | % |',
            '|--------|---------|-------|---|',
            ...rows,
            '',
          ].join('\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, body);
          EOF
          fi

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage-report
          path: backend/coverage/
          retention-days: 14
