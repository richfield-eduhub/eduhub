name: Tests

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
    paths:
      - 'backend/**'
      - 'docker-compose.test.yml'
      - 'Makefile'
      - '.github/workflows/test.yml'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'docker-compose.test.yml'
      - 'Makefile'
      - '.github/workflows/test.yml'
      - '.github/workflows/backend-tests.yml'

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    uses: ./.github/workflows/backend-tests.yml
    with:
      with_coverage: true
